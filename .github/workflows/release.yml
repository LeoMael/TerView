# Genera los instaladores de SSHorus y los adjunta a un Release en BORRADOR.
#
# Se dispara al subir una etiqueta de versión (git tag v0.3.0 && git push origin v0.3.0)
# o a mano desde la pestaña Actions / `gh workflow run release.yml`.
# La etiqueta del Release sale de la versión de src-tauri/tauri.conf.json (v__VERSION__),
# así que antes de etiquetar hay que subir la versión en tauri.conf.json, Cargo.toml y package.json.
#
# Instaladores que produce:
#   Linux   -> .deb, .rpm, .AppImage
#   Windows -> .msi (WiX) y -setup.exe (NSIS)
#   macOS   -> .dmg universal (Intel + Apple Silicon)
# Un fallo en un sistema no cancela los demás (fail-fast: false).
#
# Actualizaciones automáticas (tauri-plugin-updater):
#   Con el secreto TAURI_SIGNING_PRIVATE_KEY (y TAURI_SIGNING_PRIVATE_KEY_PASSWORD) cada instalador se
#   firma (.sig) y tauri-action sube `latest.json` al Release; la app lo consulta en
#   https://github.com/LeoMael/SSHorus/releases/latest/download/latest.json
#   (solo cuenta el Release PUBLICADO más reciente: los borradores no los ve la app).
#   Sin el secreto se generan igual los instaladores, pero sin firma ni latest.json: el trabajo lo avisa
#   (aviso amarillo y en el resumen del trabajo). Por eso la 0.3.0 y la 0.5.0 no subieron latest.json.
#   La llave tiene que ser la pareja de la `pubkey` de src-tauri/tauri.conf.json (si se cambia una, la
#   otra también; las apps ya instaladas solo aceptan actualizaciones firmadas con su llave).
#   Crear los secretos:  gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/terview-updater.key
#                        gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD < ~/.tauri/terview-updater.password
#   (si la llave no tiene contraseña, el segundo secreto puede faltar).

name: Publicar versión

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instaladores:
    name: Instaladores (${{ matrix.nombre }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Linux
            platform: ubuntu-22.04
            args: ""
          - nombre: Windows
            platform: windows-latest
            args: ""
          # tauri-cli solo une con lipo el binario principal; el puente `sshorus-mcp` lo une
          # src-tauri/scripts/sshorus-mcp-universal.sh (beforeBundleCommand de tauri.macos.conf.json).
          - nombre: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            patchelf \
            rpm

      # aws-lc-sys (cifrado de russh) ensambla código con NASM en Windows x86_64.
      # Si este paso fallara, AWS_LC_SYS_PREBUILT_NASM=1 (en el env del trabajo) hace que use los
      # objetos NASM precompilados que trae el propio crate.
      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
        continue-on-error: true

      - name: Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Rust (estable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # En macOS se compila para Intel y Apple Silicon a la vez (binario universal).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}

      - name: Dependencias de npm
        run: npm ci

      # Sin la llave privada, `tauri build` fallaría al firmar los paquetes de actualización:
      # en ese caso se desactivan (createUpdaterArtifacts=false) y se avisa, pero los instaladores salen igual.
      - name: Firma de actualizaciones
        id: firma
        shell: bash
        env:
          LLAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$LLAVE" ]; then
            echo "Llave de firma presente: se generan .sig y latest.json."
            if [ -z "$CLAVE" ]; then
              echo "::notice title=Llave sin contraseña::No está el secreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Si la llave tiene contraseña, la firma fallará: créalo con gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD < ~/.tauri/terview-updater.password"
            fi
            echo "activa=1" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=SIN ACTUALIZACIONES AUTOMÁTICAS::Falta el secreto TAURI_SIGNING_PRIVATE_KEY en el repositorio. Los instaladores salen, pero sin firmas .sig ni latest.json: las apps instaladas NO verán esta versión. Créalo con: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/terview-updater.key (y TAURI_SIGNING_PRIVATE_KEY_PASSWORD) y vuelve a lanzar este workflow."
            {
              echo "## Sin actualizaciones automáticas (${RUNNER_OS})"
              echo
              echo "Falta el secreto \`TAURI_SIGNING_PRIVATE_KEY\`: este Release no tendrá \`latest.json\` ni las firmas \`.sig\`,"
              echo "así que la app instalada no lo encontrará al buscar actualizaciones."
              echo
              echo '```bash'
              echo 'gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/terview-updater.key'
              echo 'gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD < ~/.tauri/terview-updater.password'
              echo '```'
              echo
              echo "Después borra el Release en borrador y vuelve a lanzar el workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "activa=" >> "$GITHUB_OUTPUT"
            echo "args=--config '{\"bundle\":{\"createUpdaterArtifacts\":false}}'" >> "$GITHUB_OUTPUT"
          fi

      # Notas del Release = sección de esta versión en CHANGELOG.md. También van en latest.json y la app
      # las muestra en "Hay una versión nueva" (solo lo que está antes de la línea `---`).
      - name: Notas de la versión
        id: notas
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NOTAS=$(awk -v v="## [$VERSION]" '
            index($0, "## [") == 1 { if (dentro) exit; if (index($0, v) == 1) { dentro = 1; next } }
            dentro { print }
          ' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$NOTAS" ]; then
            NOTAS="Novedades: ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          fi
          {
            echo "cuerpo<<FIN_NOTAS_SSHORUS"
            echo "$NOTAS"
            echo "FIN_NOTAS_SSHORUS"
          } >> "$GITHUB_OUTPUT"

      - name: Compilar y publicar instaladores
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: SSHorus v__VERSION__
          releaseBody: |
            ${{ steps.notas.outputs.cuerpo }}

            ---

            Historial completo: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            **Instalación:** ver la sección [Instalación del README](https://github.com/${{ github.repository }}#instalación).

            | Sistema | Archivo |
            |---------|---------|
            | Fedora / RHEL / openSUSE | `.rpm` |
            | Debian / Ubuntu / Mint | `.deb` |
            | Cualquier Linux | `.AppImage` |
            | Windows 10 / 11 | `-setup.exe` (normal) o `.msi` (empresas / instalación silenciosa) |
            | macOS (Intel y Apple Silicon) | `.dmg` |

            Los instaladores de Windows y macOS aún no están firmados: Windows SmartScreen puede mostrar
            "Windows protegió su PC" (*Más información → Ejecutar de todas formas*) y macOS puede pedir
            abrir la app con clic derecho → *Abrir*.
          releaseDraft: true
          prerelease: false
          # latest.json: en Windows actualiza con el -setup.exe (NSIS, por usuario, sin permisos de admin).
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.firma.outputs.args }}

      # Comprueba que el Release (borrador) tiene latest.json cuando se firmó. Sin él, las apps instaladas
      # no ven la versión nueva; antes pasaba sin que nadie se enterara.
      - name: Comprobar latest.json
        if: steps.firma.outputs.activa == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "latest.json subido al Release v$VERSION."
          else
            echo "::warning title=Falta latest.json::El Release v$VERSION no tiene latest.json aunque había llave de firma. Revisa el paso «Compilar y publicar instaladores»."
          fi
