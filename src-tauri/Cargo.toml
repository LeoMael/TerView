[package]
name = "terview"
version = "0.5.0"
description = "Cliente SSH/SFTP visual"
authors = []
edition = "2024"
# Hay dos programas: la app (`terview`) y el puente MCP por stdio (`terview-mcp`, en src/bin/).
default-run = "terview"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
russh = "0.65.1"
russh-sftp = "3.0.1"
thiserror = "2.0.21"
dirs = "7.0.0"
tauri-plugin-window-state = "2.5.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
keyring = "4.2.0"
tauri-plugin-dialog = "2.8.4"
futures = "0.3.34"
walkdir = "2.5.0"
log = "0.4.35"
tokio-util = "0.7.20"
tauri-plugin-clipboard-manager = "2.5.0"
# Actualizaciones automáticas (latest.json firmado en GitHub Releases) y reinicio tras instalar.
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# GitHub (módulo `github`): HTTPS con rustls + aws-lc-rs (ya en el árbol por russh), sin OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Sincronización cifrada (ya en el árbol por russh/ssh-key): AES-256-GCM + Argon2id.
aes-gcm = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.4"
base64ct = { version = "1.8", features = ["alloc"] }
chrono = "0.4"
# Bóveda de contraseñas (`storage::vault`): pisa con ceros la llave y los secretos al bloquear.
# Ya estaba en el árbol (aes-gcm, argon2, russh).
zeroize = "1.8"
# Servidor MCP para asistentes de IA (módulo `mcp`): SDK oficial de MCP para Rust y un servidor
# HTTP mínimo solo en 127.0.0.1 (hyper ya estaba en el árbol por reqwest).
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tower-service = "0.3"
regex = "1"
# Escáner de vulnerabilidades (`vulnscan`): puntuación CVSS v2/v3/v4 (solo cálculo, sin red).
cvss = "3"

[dev-dependencies]
# Pruebas de punta a punta del servidor MCP con el cliente oficial.
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
# Relojes simulados (tiempo límite de las aprobaciones sin esperar de verdad).
tokio = { version = "1.54.1", features = ["full", "test-util"] }

# Windows: aws-lc-sys (cripto de russh) necesita NASM para x86_64; con `prebuilt-nasm` usa los
# objetos ya ensamblados que trae el crate, así el build de CI no depende de tener NASM instalado.
[target.'cfg(windows)'.dependencies]
aws-lc-sys = { version = "0.47", features = ["prebuilt-nasm"] }
# Arrastrar archivos al Explorador (módulo `dragout`): la misma versión que ya trae Tauri.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# Arrastrar archivos al escritorio / gestor de archivos (módulo `dragout`): GTK3, ya en el árbol por Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Arrastrar archivos a Finder (módulo `dragout`). En macOS el crate de CrabNebula funciona bien.
[target.'cfg(target_os = "macos")'.dependencies]
drag = "2.1.1"


# Argon2id (bóveda y copia sincronizada) es ~10 veces más lento sin optimizar: en desarrollo
# desbloquear tardaría varios segundos. Solo estos crates se compilan optimizados.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
