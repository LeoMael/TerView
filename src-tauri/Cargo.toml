[package]
name = "terview"
version = "0.3.0"
description = "Cliente SSH/SFTP visual"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
russh = "0.65.1"
russh-sftp = "3.0.1"
thiserror = "2.0.21"
dirs = "7.0.0"
tauri-plugin-window-state = "2.5.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
keyring = "4.2.0"
tauri-plugin-dialog = "2.8.4"
futures = "0.3.34"
walkdir = "2.5.0"
log = "0.4.35"
tokio-util = "0.7.20"
tauri-plugin-clipboard-manager = "2.5.0"

# Windows: aws-lc-sys (cripto de russh) necesita NASM para x86_64; con `prebuilt-nasm` usa los
# objetos ya ensamblados que trae el crate, así el build de CI no depende de tener NASM instalado.
[target.'cfg(windows)'.dependencies]
aws-lc-sys = { version = "0.47", features = ["prebuilt-nasm"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
