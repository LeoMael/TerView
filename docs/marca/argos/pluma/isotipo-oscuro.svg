<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>argos - propuesta pluma (fondo oscuro)</title>
  <defs>
    <mask id="barbas-oscuro">
      <rect width="256" height="256" fill="#fff"/>
      <!-- cortes en el borde: las barbas de la pluma -->
      <g stroke="#000" stroke-width="7" stroke-linecap="round">
        <path d="M52 128 L84 148"/><path d="M60 168 L92 182"/><path d="M80 202 L106 208"/>
        <path d="M204 128 L172 148"/><path d="M196 168 L164 182"/><path d="M176 202 L150 208"/>
      </g>
    </mask>
  </defs>
  <!-- tallo -->
  <path d="M128 214 L128 250" stroke="#F0A500" stroke-width="12" stroke-linecap="round"/>
