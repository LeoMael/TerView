  <rect width="1600" height="970" fill="#0f172a"/>

  <text x="60" y="62" class="t">Publicación y actualizaciones</text>
  <text x="60" y="94" class="st">GitHub Actions compila y firma los instaladores; la app instalada busca la versión nueva y se actualiza sola.</text>

  <!-- Zonas -->
  <rect x="40" y="120" width="310" height="760" rx="24" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="152" class="z" style="fill:#94a3b8">TU PC (DESARROLLO)</text>
  <rect x="370" y="120" width="810" height="760" rx="24" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="394" y="152" class="z" style="fill:#f472b6">GITHUB</text>
  <rect x="1220" y="120" width="340" height="760" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1242" y="152" class="z" style="fill:#38bdf8">PC DEL USUARIO</text>

  <!-- ===== Tu PC ===== -->
  <rect x="60" y="175" width="270" height="120" rx="14" class="nb"/>
  <use href="#i-git" x="76" y="190" width="36" height="36" style="color:#e2e8f0"/>
  <text x="124" y="215" class="b">Cambios</text>
  <text x="76" y="254" class="mono" style="font-size:14px;fill:#cbd5e1">git push</text>
  <text x="76" y="276" class="s">a main o pull request</text>

  <rect x="60" y="355" width="270" height="200" rx="14" class="nb"/>
  <use href="#i-tag" x="76" y="370" width="36" height="36" style="color:#e2e8f0"/>
  <text x="124" y="395" class="b">Nueva versión</text>
  <text x="76" y="432" class="s">1. Sube la versión en</text>
  <text x="76" y="452" class="xs mono">tauri.conf.json, Cargo.toml</text>
  <text x="76" y="470" class="xs mono">y package.json</text>
  <text x="76" y="498" class="s">2. Crea y sube la etiqueta</text>
  <text x="76" y="522" class="mono" style="font-size:13px;fill:#cbd5e1">git tag v0.3.0</text>
  <text x="76" y="542" class="mono" style="font-size:13px;fill:#cbd5e1">git push origin v0.3.0</text>

  <rect x="60" y="680" width="270" height="120" rx="14" class="nb"/>
  <use href="#i-eye" x="76" y="695" width="36" height="36" style="color:#e2e8f0"/>
  <text x="124" y="720" class="b">Revisas</text>
  <text x="76" y="758" class="s">y publicas el borrador</text>
  <text x="76" y="780" class="s">en la web de GitHub</text>

  <!-- ===== GitHub: CI ===== -->
  <rect x="400" y="175" width="750" height="120" rx="14" class="gh"/>
  <use href="#i-shield" x="416" y="190" width="36" height="36" style="color:#f472b6"/>
  <text x="464" y="215" class="b">CI · <tspan class="mono" style="font-weight:400">ci.yml</tspan></text>
  <text x="416" y="252" class="s">Comprueba que todo compila y pasa las pruebas. No publica nada.</text>
  <text x="416" y="278" class="mono" style="font-size:14px;fill:#f9a8d4">tsc → vite build → cargo clippy → cargo test --lib</text>
  <rect x="890" y="195" width="110" height="32" rx="16" class="ghi"/>
  <text x="945" y="216" text-anchor="middle" class="s" style="fill:#e2e8f0">Linux</text>
  <rect x="1015" y="195" width="115" height="32" rx="16" class="ghi"/>
  <text x="1072" y="216" text-anchor="middle" class="s" style="fill:#e2e8f0">Windows</text>

  <line x1="330" y1="235" x2="396" y2="235" stroke="#94a3b8" stroke-width="3" marker-end="url(#mn)"/>

  <!-- ===== GitHub: Release ===== -->
  <rect x="400" y="355" width="750" height="260" rx="14" class="gh"/>
  <use href="#i-play" x="416" y="370" width="36" height="36" style="color:#f472b6"/>
  <text x="464" y="395" class="b">Publicar versión · <tspan class="mono" style="font-weight:400">release.yml</tspan></text>
  <text x="416" y="430" class="s">Con la etiqueta v* o a mano. Un sistema que falla no cancela los demás.</text>

  <rect x="416" y="448" width="230" height="86" rx="12" class="ghi"/>
  <use href="#i-pc" x="428" y="458" width="26" height="26" style="color:#e2e8f0"/>
  <text x="464" y="478" class="b" style="font-size:16px">Linux</text>
  <text x="428" y="516" class="mono" style="font-size:14px;fill:#f9a8d4">.deb  .rpm  .AppImage</text>

  <rect x="660" y="448" width="230" height="86" rx="12" class="ghi"/>
  <use href="#i-pc" x="672" y="458" width="26" height="26" style="color:#e2e8f0"/>
  <text x="708" y="478" class="b" style="font-size:16px">Windows</text>
  <text x="672" y="516" class="mono" style="font-size:14px;fill:#f9a8d4">.msi  -setup.exe</text>

  <rect x="904" y="448" width="230" height="86" rx="12" class="ghi"/>
  <use href="#i-pc" x="916" y="458" width="26" height="26" style="color:#e2e8f0"/>
  <text x="952" y="478" class="b" style="font-size:16px">macOS</text>
  <text x="916" y="516" class="mono" style="font-size:14px;fill:#f9a8d4">.dmg universal</text>

  <use href="#i-key" x="416" y="552" width="26" height="26" style="color:#facc15"/>
  <text x="452" y="571" class="s"><tspan style="fill:#e2e8f0">Firma:</tspan> secreto <tspan class="mono" style="fill:#fde68a">TAURI_SIGNING_PRIVATE_KEY</tspan> → <tspan class="mono" style="fill:#fde68a">.sig</tspan> + <tspan class="mono" style="fill:#fde68a">latest.json</tspan></text>
  <use href="#i-file" x="416" y="580" width="26" height="26" style="color:#e2e8f0"/>
  <text x="452" y="599" class="s"><tspan style="fill:#e2e8f0">Notas:</tspan> la sección de esta versión en <tspan class="mono" style="fill:#cbd5e1">CHANGELOG.md</tspan></text>

  <line x1="330" y1="455" x2="396" y2="455" stroke="#94a3b8" stroke-width="3" marker-end="url(#mn)"/>

  <!-- ===== GitHub: Releases ===== -->
  <line x1="580" y1="615" x2="580" y2="676" stroke="#f472b6" stroke-width="3" marker-end="url(#mk)"/>
  <text x="596" y="640" class="s" style="fill:#f472b6;font-weight:700">sube</text>

  <rect x="400" y="680" width="330" height="150" rx="14" class="db"/>
  <use href="#i-db" x="416" y="696" width="36" height="36" style="color:#facc15"/>
  <text x="464" y="720" class="b">Release en BORRADOR</text>
  <text x="416" y="760" class="s">instaladores + .sig + latest.json</text>
  <text x="416" y="784" class="s">La app todavía no lo ve.</text>
  <text x="416" y="808" class="xs">Sin el secreto: sin .sig ni latest.json</text>

  <line x1="330" y1="740" x2="396" y2="740" stroke="#94a3b8" stroke-width="3" marker-end="url(#mn)"/>

  <line x1="730" y1="770" x2="816" y2="770" stroke="#facc15" stroke-width="3" marker-end="url(#my)"/>
  <text x="774" y="750" text-anchor="middle" class="xs" style="fill:#facc15;font-weight:700">publicar</text>

  <rect x="820" y="680" width="330" height="150" rx="14" class="db"/>
  <use href="#i-db" x="836" y="696" width="36" height="36" style="color:#facc15"/>
  <text x="884" y="720" class="b">Release publicado</text>
  <text x="836" y="760" class="s">el más reciente («latest»):</text>
  <text x="836" y="786" class="mono" style="font-size:13px;fill:#fde68a">…/releases/latest/</text>
  <text x="836" y="806" class="mono" style="font-size:13px;fill:#fde68a">download/latest.json</text>

  <!-- ===== PC del usuario ===== -->
  <rect x="1240" y="175" width="300" height="80" rx="14" class="ap"/>
  <use href="#i-window" x="1256" y="190" width="36" height="36" style="color:#38bdf8"/>
  <text x="1304" y="208" class="b">SSHorus instalado</text>
  <text x="1304" y="232" class="xs mono">tauri-plugin-updater</text>

  <!-- paso 1 -->
  <rect x="1240" y="275" width="300" height="90" rx="12" class="nb"/>
  <circle cx="1266" cy="301" r="14" fill="#38bdf8"/><text x="1266" y="306" text-anchor="middle" class="num">1</text>
  <text x="1292" y="307" class="b" style="font-size:16px">Busca al abrir</text>
  <text x="1256" y="336" class="s">a los 6 s, sin molestar.</text>
  <text x="1256" y="355" class="xs">Se puede apagar en Ajustes.</text>

  <!-- paso 2 -->
  <rect x="1240" y="380" width="300" height="90" rx="12" class="nb"/>
  <circle cx="1266" cy="406" r="14" fill="#38bdf8"/><text x="1266" y="411" text-anchor="middle" class="num">2</text>
  <text x="1292" y="412" class="b" style="font-size:16px">Lee latest.json</text>
  <text x="1256" y="441" class="s">versión, notas, enlaces</text>
  <text x="1256" y="460" class="xs">y firma de cada instalador</text>

  <!-- paso 3 -->
  <rect x="1240" y="485" width="300" height="90" rx="12" class="nb"/>
  <circle cx="1266" cy="511" r="14" fill="#38bdf8"/><text x="1266" y="516" text-anchor="middle" class="num">3</text>
  <text x="1292" y="517" class="b" style="font-size:16px">Verifica la firma</text>
  <text x="1256" y="546" class="s">con la llave pública de</text>
  <text x="1256" y="565" class="xs mono">tauri.conf.json</text>

  <!-- paso 4 -->
  <rect x="1240" y="590" width="300" height="160" rx="12" class="nb"/>
  <circle cx="1266" cy="616" r="14" fill="#38bdf8"/><text x="1266" y="621" text-anchor="middle" class="num">4</text>
  <text x="1292" y="622" class="b" style="font-size:16px">Descarga e instala</text>
  <text x="1256" y="652" class="s">AppImage: cambia el archivo</text>
  <text x="1256" y="676" class="s">.deb / .rpm: con pkexec</text>
  <text x="1256" y="700" class="s">Windows: instalador pasivo</text>
  <text x="1256" y="724" class="s">macOS: cambia la app</text>

  <!-- paso 5 -->
  <rect x="1240" y="765" width="300" height="90" rx="12" class="nb"/>
  <circle cx="1266" cy="791" r="14" fill="#38bdf8"/><text x="1266" y="796" text-anchor="middle" class="num">5</text>
  <text x="1292" y="797" class="b" style="font-size:16px">Reinicia</text>
  <text x="1256" y="826" class="s">con tauri-plugin-process</text>

  <!-- flecha HTTPS -->
  <polyline points="1150,755 1200,755 1200,425 1236,425" fill="none" stroke="#22c55e" stroke-width="3" marker-end="url(#mg)"/>
  <rect x="1188" y="560" width="24" height="60" fill="#0f172a"/>
  <text transform="translate(1206 590) rotate(-90)" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#22c55e">HTTPS</text>

  <text x="60" y="918" style="font-size:17px;fill:#94a3b8">Solo cuenta el Release publicado más reciente. En Windows latest.json apunta al -setup.exe (NSIS, sin permisos de administrador).</text>
  <text x="60" y="946" style="font-size:17px;fill:#94a3b8">Los instaladores de Windows y macOS aún no llevan firma del sistema: SmartScreen o Gatekeeper pueden avisar la primera vez.</text>
</svg>
