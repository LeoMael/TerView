<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .h{font-size:22px;font-weight:700}
    .b{font-size:18px;font-weight:600}
    .s{font-size:15px;fill:#94a3b8}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
  </style>
  <rect width="1600" height="900" fill="#0f172a"/>

  <text x="60" y="62" class="t">Una conexión SSH, muchos canales</text>
  <text x="60" y="94" class="st">Te autenticas una sola vez y todo viaja en paralelo por el mismo túnel cifrado.</text>

  <!-- TerView -->
  <rect x="60" y="150" width="360" height="640" rx="18" fill="#10243a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="85" y="190" class="h" style="fill:#38bdf8">TERVIEW</text>
  <text x="85" y="214" class="s">pestaña «web-prod»</text>

  <rect x="85" y="245" width="310" height="80" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="105" y="280" class="b">Terminal 1</text><text x="105" y="306" class="s">lo que escribes y ves</text>
  <rect x="85" y="345" width="310" height="80" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="105" y="380" class="b">Terminal 2</text><text x="105" y="406" class="s">otra shell en paralelo</text>
  <rect x="85" y="445" width="310" height="80" rx="12" fill="#1e293b" stroke="#facc15"/>
  <text x="105" y="480" class="b">Explorador</text><text x="105" y="506" class="s">navegar carpetas</text>
  <rect x="85" y="545" width="310" height="200" rx="12" fill="#1e293b" stroke="#f97316"/>
  <text x="105" y="580" class="b">Cola de subidas</text><text x="105" y="606" class="s">2.000 archivos esperando</text>
  <rect x="105" y="630" width="270" height="12" rx="6" fill="#334155"/><rect x="105" y="630" width="86" height="12" rx="6" fill="#f97316"/>
  <text x="105" y="672" class="s">640 / 2.000 · 12 MB/s</text>

  <!-- Túnel -->
  <rect x="440" y="150" width="700" height="640" rx="40" fill="#131c2e" stroke="#64748b" stroke-width="3"/>
  <text x="790" y="200" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#cbd5e1">1 conexión SSH · cifrada · autenticada una vez</text>

  <rect x="470" y="245" width="640" height="80" rx="14" fill="#0e2a3d" stroke="#38bdf8"/>
  <text x="495" y="280" class="b" style="fill:#38bdf8">Canal 1 · Terminal</text><text x="495" y="306" class="s">teclas ⇄ salida (PTY)</text>
  <line x1="800" y1="285" x2="1085" y2="285" stroke="#38bdf8" stroke-width="3" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <rect x="470" y="345" width="640" height="80" rx="14" fill="#0e2a3d" stroke="#38bdf8"/>
  <text x="495" y="380" class="b" style="fill:#38bdf8">Canal 2 · Terminal</text><text x="495" y="406" class="s">teclas ⇄ salida (PTY)</text>
  <line x1="800" y1="385" x2="1085" y2="385" stroke="#38bdf8" stroke-width="3" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <rect x="470" y="445" width="640" height="80" rx="14" fill="#2e2a0e" stroke="#facc15"/>
  <text x="495" y="480" class="b" style="fill:#facc15">Canal 3 · SFTP explorador</text><text x="495" y="506" class="s">listar, renombrar, borrar</text>
  <line x1="800" y1="485" x2="1085" y2="485" stroke="#facc15" stroke-width="3" marker-start="url(#my)" marker-end="url(#my)"/>

  <rect x="470" y="545" width="640" height="200" rx="14" fill="#2e1a0e" stroke="#f97316"/>
  <text x="495" y="580" class="b" style="fill:#f97316">Canales 4 a 7 · Transferencias</text><text x="495" y="606" class="s">4 archivos a la vez</text>
  <text x="495" y="645" class="mono" style="font-size:14px">img_0641.jpg</text>
  <line x1="640" y1="640" x2="1085" y2="640" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>
  <text x="495" y="673" class="mono" style="font-size:14px">img_0642.jpg</text>
  <line x1="640" y1="668" x2="1085" y2="668" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>
  <text x="495" y="701" class="mono" style="font-size:14px">img_0643.jpg</text>
  <line x1="640" y1="696" x2="1085" y2="696" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>
  <text x="495" y="729" class="mono" style="font-size:14px">img_0644.jpg</text>
  <line x1="640" y1="724" x2="1085" y2="724" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>

  <!-- uniones -->
  <line x1="395" y1="285" x2="470" y2="285" stroke="#38bdf8" stroke-width="2"/>
  <line x1="395" y1="385" x2="470" y2="385" stroke="#38bdf8" stroke-width="2"/>
  <line x1="395" y1="485" x2="470" y2="485" stroke="#facc15" stroke-width="2"/>
  <line x1="395" y1="645" x2="470" y2="645" stroke="#f97316" stroke-width="2"/>
  <line x1="1110" y1="285" x2="1185" y2="285" stroke="#38bdf8" stroke-width="2"/>
  <line x1="1110" y1="385" x2="1185" y2="385" stroke="#38bdf8" stroke-width="2"/>
  <line x1="1110" y1="485" x2="1185" y2="485" stroke="#facc15" stroke-width="2"/>
  <line x1="1110" y1="645" x2="1185" y2="645" stroke="#f97316" stroke-width="2"/>

  <!-- Servidor -->
  <rect x="1160" y="150" width="380" height="640" rx="18" fill="#0f2a1c" stroke="#22c55e" stroke-width="2.5"/>
  <text x="1185" y="190" class="h" style="fill:#22c55e">SERVIDOR</text>
  <text x="1185" y="214" class="s mono">deploy@192.168.1.10</text>
  <rect x="1185" y="245" width="330" height="80" rx="12" fill="#14301f" stroke="#22c55e"/>
  <text x="1205" y="280" class="b">bash</text><text x="1205" y="306" class="s">sesión de terminal 1</text>
  <rect x="1185" y="345" width="330" height="80" rx="12" fill="#14301f" stroke="#22c55e"/>
  <text x="1205" y="380" class="b">bash</text><text x="1205" y="406" class="s">sesión de terminal 2</text>
  <rect x="1185" y="445" width="330" height="80" rx="12" fill="#14301f" stroke="#22c55e"/>
  <text x="1205" y="480" class="b">sftp-server</text><text x="1205" y="506" class="s">sistema de archivos</text>
  <rect x="1185" y="545" width="330" height="200" rx="12" fill="#14301f" stroke="#22c55e"/>
  <text x="1205" y="580" class="b">sftp-server × 4</text><text x="1205" y="606" class="s mono">→ /var/www/fotos/</text>

  <text x="60" y="845" style="font-size:17px;fill:#94a3b8">Si navegas carpetas mientras subes 2.000 archivos, nada se bloquea: cada cosa va por su propio canal.</text>
</svg>
