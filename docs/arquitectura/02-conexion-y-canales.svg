  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .h{font-size:22px;font-weight:700}
    .b{font-size:18px;font-weight:600}
    .s{font-size:15px;fill:#94a3b8}
    .xs{font-size:13px;fill:#94a3b8}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .z{font-size:15px;font-weight:700;letter-spacing:2px}
    .ml{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-size:13px}
  </style>
  <rect width="1600" height="950" fill="#0f172a"/>

  <text x="60" y="62" class="t">Una conexión SSH, muchos canales</text>
  <text x="60" y="94" class="st">Te autenticas una sola vez y todo viaja en paralelo por la misma conexión cifrada.</text>

  <!-- Zonas -->
  <rect x="40" y="112" width="380" height="748" rx="24" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="142" class="z" style="fill:#94a3b8">TU PC · SSHORUS</text>
  <use href="#i-window" x="62" y="160" width="36" height="36" style="color:#38bdf8"/>
  <text x="110" y="185" class="b" style="fill:#38bdf8">pestaña «web-prod»</text>
  <rect x="440" y="112" width="720" height="748" rx="24" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="462" y="142" class="z" style="fill:#64748b">INTERNET O RED LOCAL</text>
  <rect x="1180" y="112" width="380" height="748" rx="24" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1202" y="142" class="z" style="fill:#22c55e">TU SERVIDOR</text>
  <use href="#i-server" x="1202" y="160" width="36" height="36" style="color:#22c55e"/>
  <text x="1250" y="185" class="mono" style="font-size:16px">deploy@192.168.1.10</text>

  <!-- Conexión -->
  <rect x="460" y="158" width="680" height="686" rx="36" fill="#131c2e" stroke="#64748b" stroke-width="3"/>
  <use href="#i-lock" x="530" y="170" width="28" height="28" style="color:#cbd5e1"/>
  <text x="810" y="192" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#cbd5e1">1 conexión SSH · cifrada · autenticada una vez</text>

  <!-- ===== Fila 1: terminales ===== -->
  <rect x="62" y="220" width="336" height="80" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <use href="#i-term" x="76" y="244" width="32" height="32" style="color:#38bdf8"/>
  <text x="122" y="254" class="b">Terminales</text><text x="122" y="280" class="s">una o varias por pestaña</text>
  <line x1="398" y1="260" x2="485" y2="260" stroke="#38bdf8" stroke-width="1.5"/>

  <rect x="485" y="220" width="630" height="80" rx="14" fill="#0e2a3d" stroke="#38bdf8"/>
  <text x="505" y="254" class="b" style="fill:#38bdf8">Terminal (PTY)</text><text x="505" y="280" class="s">un canal por terminal · puede ir en tmux</text>
  <line x1="880" y1="260" x2="1092" y2="260" stroke="#38bdf8" stroke-width="3" marker-start="url(#mb)" marker-end="url(#mb)"/>

  <line x1="1115" y1="260" x2="1200" y2="260" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="1200" y="220" width="340" height="80" rx="12" fill="#14301f" stroke="#22c55e"/>
  <use href="#i-term" x="1214" y="244" width="32" height="32" style="color:#22c55e"/>
  <text x="1260" y="254" class="b">Shell o sesión tmux</text><text x="1260" y="280" class="s">con tmux sigue viva sin red</text>

  <!-- ===== Fila 2: SFTP explorador ===== -->
  <rect x="62" y="316" width="336" height="100" rx="12" fill="#1e293b" stroke="#facc15"/>
  <use href="#i-folder" x="76" y="340" width="32" height="32" style="color:#facc15"/>
  <text x="122" y="350" class="b">Explorador y editor</text><text x="122" y="376" class="s">listar, renombrar, permisos,</text><text x="122" y="397" class="s">abrir y guardar archivos</text>
  <line x1="398" y1="366" x2="485" y2="366" stroke="#facc15" stroke-width="1.5"/>

  <rect x="485" y="316" width="630" height="100" rx="14" fill="#2e2a0e" stroke="#facc15"/>
  <text x="505" y="350" class="b" style="fill:#facc15">SFTP del explorador</text><text x="505" y="376" class="s">se abre al primer uso; si muere,</text><text x="505" y="397" class="s">se abre otro y se reintenta una vez</text>
  <line x1="880" y1="366" x2="1092" y2="366" stroke="#facc15" stroke-width="3" marker-start="url(#my)" marker-end="url(#my)"/>

  <line x1="1115" y1="366" x2="1200" y2="366" stroke="#facc15" stroke-width="1.5"/>
  <rect x="1200" y="316" width="340" height="100" rx="12" fill="#14301f" stroke="#22c55e"/>
  <use href="#i-folder" x="1214" y="340" width="32" height="32" style="color:#22c55e"/>
  <text x="1260" y="350" class="b">sftp-server</text><text x="1260" y="376" class="s">sistema de archivos</text>

  <!-- ===== Fila 3: transferencias ===== -->
  <rect x="62" y="432" width="336" height="120" rx="12" fill="#1e293b" stroke="#f97316"/>
  <use href="#i-download" x="76" y="456" width="32" height="32" style="color:#f97316"/>
  <text x="122" y="466" class="b">Transferencias</text><text x="122" y="492" class="s">2.000 archivos en cola</text>
  <rect x="122" y="508" width="250" height="10" rx="5" fill="#334155"/><rect x="122" y="508" width="80" height="10" rx="5" fill="#f97316"/>
  <text x="122" y="540" class="xs">640 / 2.000 · 12 MB/s</text>
  <line x1="398" y1="492" x2="485" y2="492" stroke="#f97316" stroke-width="1.5"/>

  <rect x="485" y="432" width="630" height="120" rx="14" fill="#2e1a0e" stroke="#f97316"/>
  <text x="505" y="466" class="b" style="fill:#f97316">SFTP de transferencias</text><text x="505" y="492" class="s">reserva de hasta 10 canales;</text><text x="505" y="513" class="s">de 1 a 8 archivos a la vez (4 por defecto)</text>
  <text x="880" y="469" class="ml">img_0641.jpg</text><line x1="985" y1="465" x2="1092" y2="465" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>
  <text x="880" y="497" class="ml">img_0642.jpg</text><line x1="985" y1="493" x2="1092" y2="493" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>
  <text x="880" y="525" class="ml">img_0643.jpg</text><line x1="985" y1="521" x2="1092" y2="521" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>

  <line x1="1115" y1="492" x2="1200" y2="492" stroke="#f97316" stroke-width="1.5"/>
  <rect x="1200" y="432" width="340" height="120" rx="12" fill="#14301f" stroke="#22c55e"/>
  <use href="#i-folder" x="1214" y="456" width="32" height="32" style="color:#22c55e"/>
  <text x="1260" y="466" class="b">sftp-server × N</text><text x="1260" y="492" class="mono" style="font-size:14px;fill:#94a3b8">→ /var/www/fotos/</text>

  <!-- ===== Fila 4: exec ===== -->
  <rect x="62" y="568" width="336" height="120" rx="12" fill="#1e293b" stroke="#a78bfa"/>
  <use href="#i-play" x="76" y="592" width="32" height="32" style="color:#a78bfa"/>
  <text x="122" y="602" class="b">Comandos aparte</text><text x="122" y="628" class="s">Comandos · Monitor</text><text x="122" y="649" class="s">Contenedores · Administración</text><text x="122" y="670" class="s">Privilegios · Varios servidores</text>
  <line x1="398" y1="628" x2="485" y2="628" stroke="#a78bfa" stroke-width="1.5"/>

  <rect x="485" y="568" width="630" height="120" rx="14" fill="#1e1838" stroke="#a78bfa"/>
  <text x="505" y="602" class="b" style="fill:#a78bfa">exec · sin terminal</text><text x="505" y="628" class="s">un canal por comando; captura la salida</text><text x="505" y="649" class="s">(2 MB máx.), tiempo límite y cancelación</text>
  <text x="880" y="605" class="ml">id -u</text><line x1="985" y1="601" x2="1092" y2="601" stroke="#a78bfa" stroke-width="3" marker-start="url(#mp)" marker-end="url(#mp)"/>
  <text x="880" y="633" class="ml">ss -tulpn</text><line x1="985" y1="629" x2="1092" y2="629" stroke="#a78bfa" stroke-width="3" marker-start="url(#mp)" marker-end="url(#mp)"/>
  <text x="880" y="661" class="ml">podman ps</text><line x1="985" y1="657" x2="1092" y2="657" stroke="#a78bfa" stroke-width="3" marker-start="url(#mp)" marker-end="url(#mp)"/>

  <line x1="1115" y1="628" x2="1200" y2="628" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="1200" y="568" width="340" height="120" rx="12" fill="#14301f" stroke="#22c55e"/>
  <use href="#i-gear" x="1214" y="592" width="32" height="32" style="color:#22c55e"/>
  <text x="1260" y="602" class="b">Comandos cortos</text><text x="1260" y="628" class="s">cada uno en su proceso,</text><text x="1260" y="649" class="s">con el shell de tu usuario</text>

  <!-- ===== Fila 5: túneles ===== -->
  <rect x="62" y="704" width="336" height="120" rx="12" fill="#1e293b" stroke="#2dd4bf"/>
  <use href="#i-tunnel" x="76" y="728" width="32" height="32" style="color:#2dd4bf"/>
  <text x="122" y="738" class="b">Túneles</text><text x="122" y="764" class="s">local · remoto · SOCKS</text><text x="122" y="789" class="mono" style="font-size:14px;fill:#94a3b8">localhost:5432</text>
  <line x1="398" y1="764" x2="485" y2="764" stroke="#2dd4bf" stroke-width="1.5"/>

  <rect x="485" y="704" width="630" height="120" rx="14" fill="#0d2a2a" stroke="#2dd4bf"/>
  <text x="505" y="738" class="b" style="fill:#2dd4bf">Túnel (port forwarding)</text><text x="505" y="764" class="s">un canal por cada conexión</text><text x="505" y="785" class="s">que pasa por el túnel</text>
  <text x="880" y="744" class="ml" style="fill:#2dd4bf">direct-tcpip</text><text x="1092" y="744" text-anchor="end" class="xs">local, SOCKS</text>
  <line x1="880" y1="756" x2="1092" y2="756" stroke="#2dd4bf" stroke-width="3" marker-end="url(#mt)"/>
  <text x="880" y="787" class="ml" style="fill:#2dd4bf">forwarded-tcpip</text><text x="1092" y="787" text-anchor="end" class="xs">remoto</text>
  <line x1="1092" y1="806" x2="880" y2="806" stroke="#2dd4bf" stroke-width="3" marker-end="url(#mt)"/>

  <line x1="1115" y1="764" x2="1200" y2="764" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="1200" y="704" width="340" height="120" rx="12" fill="#14301f" stroke="#22c55e"/>
  <use href="#i-globe" x="1214" y="728" width="32" height="32" style="color:#22c55e"/>
  <text x="1260" y="738" class="b">Puertos y servicios</text><text x="1260" y="764" class="s">postgres :5432, web :8080…</text><text x="1260" y="785" class="s">o un puerto abierto para ti</text>

  <text x="60" y="910" style="font-size:17px;fill:#94a3b8">Cada cosa va por su propio canal: navegas mientras subes 2.000 archivos y el Monitor mide el servidor, y nada se bloquea.</text>
</svg>
