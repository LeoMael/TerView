<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <!-- ICONOS (48x48, trazo; el color se da con style="color:#..." en <use>) -->
    <symbol id="i-pc" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="26" rx="3"/><path d="M18 41h12M24 33v8"/></g></symbol>
    <symbol id="i-window" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M4 16h40"/></g><g fill="currentColor"><circle cx="10" cy="11.5" r="1.8"/><circle cx="16" cy="11.5" r="1.8"/><circle cx="22" cy="11.5" r="1.8"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 48 48"><g fill="currentColor"><rect x="20" y="3" width="8" height="10" rx="2"/><rect x="20" y="35" width="8" height="10" rx="2"/><rect x="3" y="20" width="10" height="8" rx="2"/><rect x="35" y="20" width="10" height="8" rx="2"/><rect x="20" y="3" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="20" y="35" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="3" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/><rect x="35" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/></g><circle cx="24" cy="24" r="13" fill="currentColor"/><circle cx="24" cy="24" r="5.5" fill="#0f172a"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="6" y="5" width="36" height="11" rx="2.5"/><rect x="6" y="19" width="36" height="11" rx="2.5"/><rect x="6" y="33" width="36" height="11" rx="2.5"/></g><g fill="currentColor"><circle cx="35" cy="10.5" r="2"/><circle cx="35" cy="24.5" r="2"/><circle cx="35" cy="38.5" r="2"/><rect x="11" y="9" width="14" height="3" rx="1.5"/><rect x="11" y="23" width="14" height="3" rx="1.5"/><rect x="11" y="37" width="14" height="3" rx="1.5"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M14 38h22a9 9 0 0 0 1-17.9A12 12 0 0 0 14.3 17 10.5 10.5 0 0 0 14 38z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-git" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="14" cy="10" r="5"/><circle cx="14" cy="38" r="5"/><circle cx="34" cy="16" r="5"/><path d="M14 15v18M34 21c0 9-20 6-20 12"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v28c0 3.3 7.2 6 16 6s16-2.7 16-6V10"/><path d="M8 19c0 3.3 7.2 6 16 6s16-2.7 16-6M8 28.5c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="30" r="9"/><path d="M21.5 23.5 40 5M33 12l5 5M28 17l4 4"/></g></symbol>
    <symbol id="i-folder" viewBox="0 0 48 48"><path d="M5 13a3 3 0 0 1 3-3h10l4 5h18a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M12 4h17l9 9v31H12z"/><path d="M29 4v9h9M18 24h14M18 31h14"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="9" y="21" width="30" height="22" rx="3"/><path d="M15 21v-6a9 9 0 0 1 18 0v6"/></g><circle cx="24" cy="32" r="3" fill="currentColor"/></symbol>
    <symbol id="i-chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="12" y="12" width="24" height="24" rx="3"/><path d="M18 5v6M24 5v6M30 5v6M18 37v6M24 37v6M30 37v6M5 18h6M5 24h6M5 30h6M37 18h6M37 24h6M37 30h6"/></g><rect x="19" y="19" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-box" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M24 4 42 13v22L24 44 6 35V13z"/><path d="M6 13l18 9 18-9M24 22v22"/></g></symbol>
    <symbol id="i-term" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M12 18l7 6-7 6M23 31h12"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4 40 10v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v36h36"/><path d="M12 32l9-10 7 6 12-15"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="15" r="8"/><path d="M8 43c0-9 7-15 16-15s16 6 16 15"/></g></symbol>
    <symbol id="i-tunnel" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 40V24a20 20 0 0 1 40 0v16"/><path d="M14 40V25a10 10 0 0 1 20 0v15"/><path d="M4 40h10M34 40h10"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="19"/><ellipse cx="24" cy="24" rx="8" ry="19"/><path d="M5 24h38M8 14h32M8 34h32"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 48 48"><path d="M14 8l26 16-26 16z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M5 6h18l20 20-17 17L5 23z"/></g><circle cx="14" cy="15" r="3" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v24M14 21l10 10 10-10M6 36v6h36v-6"/></g></symbol>
    <symbol id="i-hand" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26V9a3 3 0 0 1 6 0v14M22 21V6a3 3 0 0 1 6 0v15M28 21V9a3 3 0 0 1 6 0v14M34 23v-7a3 3 0 0 1 6 0v12c0 9-6 16-15 16-6 0-9-3-12-7l-6-9a3 3 0 0 1 5-3l3 3"/></g></symbol>
    <symbol id="i-history" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 24a17 17 0 1 0 5-12"/><path d="M6 6v8h8M24 14v11l7 4"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M3 24s8-14 21-14 21 14 21 14-8 14-21 14S3 24 3 24z"/><circle cx="24" cy="24" r="6"/></g></symbol>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .b{font-size:17px;font-weight:600}
    .s{font-size:14px;fill:#94a3b8}
    .xs{font-size:13px;fill:#94a3b8}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .z{font-size:15px;font-weight:700;letter-spacing:2px}
    .chip{fill:#1e293b;stroke:#2c4a66;stroke-width:1.5}
    .gh{fill:#2a1426;stroke:#f472b6;stroke-width:2}
    .db{fill:#2e2a0e;stroke:#facc15;stroke-width:2}
    .mem{fill:#1e1838;stroke:#a78bfa;stroke-width:2;stroke-dasharray:6 5}
    .sv{fill:#14301f;stroke:#22c55e;stroke-width:1.5}
  </style>
  <rect width="1600" height="1040" fill="#0f172a"/>

  <text x="60" y="62" class="t">GitHub dentro de SSHorus</text>
  <text x="60" y="94" class="st">El token vive en el llavero y solo lo usa el motor. Lo que toca tus servidores va por SSH.</text>

  <!-- Zonas -->
  <rect x="40" y="120" width="520" height="840" rx="24" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="152" class="z" style="fill:#94a3b8">TU PC</text>
  <rect x="600" y="120" width="960" height="400" rx="24" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="624" y="152" class="z" style="fill:#f472b6">GITHUB</text>
  <rect x="600" y="560" width="960" height="400" rx="24" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="624" y="592" class="z" style="fill:#22c55e">TUS SERVIDORES</text>

  <!-- ===== Interfaz ===== -->
  <rect x="60" y="170" width="480" height="170" rx="16" fill="#10243a" stroke="#38bdf8" stroke-width="2.5"/>
  <use href="#i-window" x="78" y="186" width="36" height="36" style="color:#38bdf8"/>
  <text x="126" y="211" class="b">Ventana GitHub</text>
  <text x="300" y="211" class="xs">(Interfaz)</text>
  <rect x="78" y="238" width="140" height="36" rx="18" class="chip"/><text x="148" y="261" text-anchor="middle" class="s" style="fill:#e2e8f0">Cuenta</text>
  <rect x="230" y="238" width="140" height="36" rx="18" class="chip"/><text x="300" y="261" text-anchor="middle" class="s" style="fill:#e2e8f0">Llaves</text>
  <rect x="382" y="238" width="140" height="36" rx="18" class="chip"/><text x="452" y="261" text-anchor="middle" class="s" style="fill:#e2e8f0">Repos</text>
  <rect x="78" y="286" width="140" height="36" rx="18" class="chip"/><text x="148" y="309" text-anchor="middle" class="s" style="fill:#e2e8f0">Despliegues</text>
  <rect x="230" y="286" width="140" height="36" rx="18" class="chip"/><text x="300" y="309" text-anchor="middle" class="s" style="fill:#e2e8f0">Actions</text>
  <rect x="382" y="286" width="140" height="36" rx="18" class="chip"/><text x="452" y="309" text-anchor="middle" class="s" style="fill:#e2e8f0">Sincronizar</text>

  <line x1="300" y1="340" x2="300" y2="406" stroke="#a78bfa" stroke-width="3" marker-end="url(#mp)"/>
  <text x="314" y="380" class="mono" style="font-size:14px;font-weight:700;fill:#a78bfa">gh_*  ·  exec_capture</text>

  <!-- ===== Motor ===== -->
  <rect x="60" y="410" width="480" height="170" rx="16" fill="#2a1a10" stroke="#f97316" stroke-width="2.5"/>
  <use href="#i-gear" x="78" y="426" width="36" height="36" style="color:#f97316"/>
  <text x="126" y="451" class="b">Motor · módulo <tspan class="mono" style="font-weight:400">github</tspan></text>
  <text x="78" y="492" class="s">• HTTPS con reqwest + rustls (sin OpenSSL)</text>
  <text x="78" y="516" class="s">• Solo hosts de GitHub: no es un proxy</text>
  <text x="78" y="540" class="s">• Cifra la copia: AES-256-GCM + Argon2id</text>
  <text x="78" y="564" class="s">• Lo del servidor: canal exec (SSH)</text>

  <line x1="175" y1="580" x2="175" y2="636" stroke="#facc15" stroke-width="3" marker-start="url(#my)" marker-end="url(#my)"/>
  <line x1="425" y1="580" x2="425" y2="636" stroke="#facc15" stroke-width="3" marker-start="url(#my)" marker-end="url(#my)"/>

  <!-- ===== Almacenes en tu PC ===== -->
  <rect x="60" y="640" width="230" height="140" rx="14" class="db"/>
  <use href="#i-key" x="76" y="654" width="34" height="34" style="color:#facc15"/>
  <text x="120" y="678" class="b">Llavero</text>
  <text x="76" y="716" class="s">token de GitHub</text>
  <text x="76" y="740" class="xs mono">servicio: sshorus</text>
  <text x="76" y="760" class="xs mono">usuario: github-token</text>

  <rect x="310" y="640" width="230" height="140" rx="14" class="db"/>
  <use href="#i-db" x="326" y="654" width="34" height="34" style="color:#facc15"/>
  <text x="370" y="678" class="b mono" style="font-weight:600;font-size:16px">github.json</text>
  <text x="326" y="716" class="s">recetas de despliegue</text>
  <text x="326" y="740" class="s">y el gist de sincronizar</text>
  <text x="326" y="760" class="xs">nunca el token</text>

  <rect x="60" y="800" width="230" height="140" rx="14" class="db"/>
  <use href="#i-folder" x="76" y="814" width="34" height="34" style="color:#facc15"/>
  <text x="120" y="838" class="b mono" style="font-weight:600;font-size:16px">~/.ssh/*.pub</text>
  <text x="76" y="876" class="s">tus llaves públicas</text>
  <text x="76" y="900" class="s">solo lectura;</text>
  <text x="76" y="920" class="xs">rechaza cualquier privada</text>

  <rect x="310" y="800" width="230" height="140" rx="14" class="mem"/>
  <use href="#i-chip" x="326" y="814" width="34" height="34" style="color:#a78bfa"/>
  <text x="370" y="838" class="b">Frase de cifrado</text>
  <text x="326" y="876" class="s">la escribes al subir</text>
  <text x="326" y="900" class="s">o bajar la copia;</text>
  <text x="326" y="920" class="xs">solo en memoria</text>

  <!-- ===== GitHub ===== -->
  <rect x="630" y="175" width="240" height="315" rx="16" class="gh"/>
  <use href="#i-globe" x="648" y="192" width="38" height="38" style="color:#f472b6"/>
  <text x="648" y="262" class="b">API de GitHub</text>
  <text x="648" y="290" class="mono" style="font-size:14px;fill:#f9a8d4">api.github.com</text>
  <text x="648" y="330" class="s">token en la cabecera</text>
  <text x="648" y="352" class="s">Authorization; nunca</text>
  <text x="648" y="374" class="s">sale en registros</text>
  <text x="648" y="374" class="s" dy="22">ni en errores</text>
  <text x="648" y="436" class="xs">errores en español</text>
  <text x="648" y="454" class="xs">(401, 403, 404, 422…)</text>

  <rect x="900" y="175" width="300" height="145" rx="16" class="gh"/>
  <use href="#i-user" x="916" y="190" width="34" height="34" style="color:#f472b6"/>
  <text x="962" y="214" class="b">Tu cuenta</text>
  <text x="916" y="256" class="s">perfil y llaves SSH</text>
  <text x="916" y="280" class="s">sube tu .pub con un clic</text>
  <text x="916" y="304" class="xs">o lee las de otro usuario</text>

  <rect x="1230" y="175" width="300" height="145" rx="16" class="db"/>
  <use href="#i-db" x="1246" y="190" width="34" height="34" style="color:#facc15"/>
  <text x="1292" y="214" class="b">Gist secreto</text>
  <text x="1246" y="256" class="mono" style="font-size:14px;fill:#fde68a">sshorus-sync.json</text>
  <text x="1246" y="280" class="s">servidores, proyectos, comandos</text>
  <text x="1246" y="304" class="xs">cifrado; sin contraseñas</text>

  <rect x="900" y="345" width="300" height="145" rx="16" class="gh"/>
  <use href="#i-play" x="916" y="360" width="34" height="34" style="color:#f472b6"/>
  <text x="962" y="384" class="b">Actions</text>
  <text x="916" y="426" class="s">workflows y ejecuciones</text>
  <text x="916" y="450" class="s">lanzar uno a mano</text>
  <text x="916" y="474" class="xs mono">workflow_dispatch</text>

  <rect x="1230" y="345" width="300" height="145" rx="16" class="gh"/>
  <use href="#i-git" x="1246" y="360" width="34" height="34" style="color:#f472b6"/>
  <text x="1292" y="384" class="b">Repositorios</text>
  <text x="1246" y="426" class="s">tus repos y sus ramas</text>
  <text x="1246" y="450" class="s">llave de despliegue</text>
  <text x="1246" y="474" class="xs">de solo lectura</text>

  <!-- Motor -> API -->
  <line x1="540" y1="455" x2="626" y2="455" stroke="#f472b6" stroke-width="3" marker-end="url(#mk)"/>
  <rect x="556" y="424" width="56" height="20" fill="#0f172a"/>
  <text x="584" y="440" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#f472b6">HTTPS</text>

  <!-- ===== Servidor ===== -->
  <rect x="630" y="610" width="900" height="320" rx="18" fill="#0f2a1c" stroke="#22c55e" stroke-width="2.5"/>
  <use href="#i-server" x="648" y="626" width="36" height="36" style="color:#22c55e"/>
  <text x="696" y="651" class="b">Servidor conectado</text>
  <text x="880" y="651" class="s">(lo hace el motor con comandos por SSH)</text>

  <rect x="650" y="690" width="270" height="215" rx="14" class="sv"/>
  <use href="#i-file" x="666" y="704" width="32" height="32" style="color:#22c55e"/>
  <text x="708" y="726" class="b mono" style="font-weight:600;font-size:15px">authorized_keys</text>
  <text x="666" y="768" class="s">añade llaves de un usuario</text>
  <text x="666" y="792" class="s">de GitHub (o las tuyas)</text>
  <text x="666" y="830" class="xs">sin duplicar; no toca</text>
  <text x="666" y="850" class="xs">enlaces simbólicos</text>

  <rect x="940" y="690" width="270" height="215" rx="14" class="sv"/>
  <use href="#i-key" x="956" y="704" width="32" height="32" style="color:#22c55e"/>
  <text x="998" y="726" class="b">Llave de despliegue</text>
  <text x="956" y="768" class="s">la crea ssh-keygen</text>
  <text x="956" y="792" class="s">en el servidor;</text>
  <text x="956" y="830" class="xs">solo su .pub va a GitHub</text>
  <text x="956" y="850" class="xs mono">~/.ssh/&lt;repo&gt;</text>

  <rect x="1230" y="690" width="280" height="215" rx="14" class="sv"/>
  <use href="#i-folder" x="1246" y="704" width="32" height="32" style="color:#22c55e"/>
  <text x="1288" y="726" class="b">Repo clonado</text>
  <text x="1246" y="768" class="s">clonar, y luego «Actualizar»:</text>
  <text x="1246" y="796" class="mono" style="font-size:13px;fill:#86efac">git pull --ff-only</text>
  <text x="1246" y="818" class="s">+ tus comandos de la receta</text>
  <text x="1246" y="850" class="xs">(npm ci, restart…)</text>

  <!-- Motor -> Servidor (SSH exec) -->
  <polyline points="540,540 580,540 580,770 646,770" fill="none" stroke="#22c55e" stroke-width="3" marker-end="url(#mg)"/>
  <rect x="566" y="680" width="28" height="60" fill="#0f172a"/>
  <text transform="translate(586 710) rotate(-90)" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#22c55e">SSH exec</text>

  <!-- Servidor <-> Repos (git) -->
  <line x1="1370" y1="686" x2="1370" y2="494" stroke="#22c55e" stroke-width="3" marker-end="url(#mg)"/>
  <text x="1356" y="545" text-anchor="end" style="font-size:14px;font-weight:700;fill:#22c55e">git por SSH <tspan class="xs" style="font-weight:400">con la llave de despliegue</tspan></text>

  <text x="60" y="992" style="font-size:17px;fill:#94a3b8">Tu token nunca sale de tu PC: el servidor baja el código con su propia llave de despliegue, de solo lectura.</text>
  <text x="60" y="1020" style="font-size:17px;fill:#94a3b8">«Mis comandos» también se pueden compartir e importar por un gist o un archivo de un repositorio.</text>
</svg>
