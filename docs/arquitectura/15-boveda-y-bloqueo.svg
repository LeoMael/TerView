<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210">
  <defs>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f43f5e"/></marker>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker>
    <!-- ICONOS (48x48, trazo; el color se da con style="color:#..." en <use>) -->
    <symbol id="i-pc" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="26" rx="3"/><path d="M18 41h12M24 33v8"/></g></symbol>
    <symbol id="i-window" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M4 16h40"/></g><g fill="currentColor"><circle cx="10" cy="11.5" r="1.8"/><circle cx="16" cy="11.5" r="1.8"/><circle cx="22" cy="11.5" r="1.8"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 48 48"><g fill="currentColor"><rect x="20" y="3" width="8" height="10" rx="2"/><rect x="20" y="35" width="8" height="10" rx="2"/><rect x="3" y="20" width="10" height="8" rx="2"/><rect x="35" y="20" width="10" height="8" rx="2"/><rect x="20" y="3" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="20" y="35" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="3" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/><rect x="35" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/></g><circle cx="24" cy="24" r="13" fill="currentColor"/><circle cx="24" cy="24" r="5.5" fill="#0f172a"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="6" y="5" width="36" height="11" rx="2.5"/><rect x="6" y="19" width="36" height="11" rx="2.5"/><rect x="6" y="33" width="36" height="11" rx="2.5"/></g><g fill="currentColor"><circle cx="35" cy="10.5" r="2"/><circle cx="35" cy="24.5" r="2"/><circle cx="35" cy="38.5" r="2"/><rect x="11" y="9" width="14" height="3" rx="1.5"/><rect x="11" y="23" width="14" height="3" rx="1.5"/><rect x="11" y="37" width="14" height="3" rx="1.5"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v28c0 3.3 7.2 6 16 6s16-2.7 16-6V10"/><path d="M8 19c0 3.3 7.2 6 16 6s16-2.7 16-6M8 28.5c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="30" r="9"/><path d="M21.5 23.5 40 5M33 12l5 5M28 17l4 4"/></g></symbol>
    <symbol id="i-file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M12 4h17l9 9v31H12z"/><path d="M29 4v9h9M18 24h14M18 31h14"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="9" y="21" width="30" height="22" rx="3"/><path d="M15 21v-6a9 9 0 0 1 18 0v6"/></g><circle cx="24" cy="32" r="3" fill="currentColor"/></symbol>
    <symbol id="i-chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="12" y="12" width="24" height="24" rx="3"/><path d="M18 5v6M24 5v6M30 5v6M18 37v6M24 37v6M30 37v6M5 18h6M5 24h6M5 30h6M37 18h6M37 24h6M37 30h6"/></g><rect x="19" y="19" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4 40 10v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="15" r="8"/><path d="M8 43c0-9 7-15 16-15s16 6 16 15"/></g></symbol>
    <symbol id="i-history" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 24a17 17 0 1 0 5-12"/><path d="M6 6v8h8M24 14v11l7 4"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M3 24s8-14 21-14 21 14 21 14-8 14-21 14S3 24 3 24z"/><circle cx="24" cy="24" r="6"/></g></symbol>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .h{font-size:20px;font-weight:700}
    .b{font-size:16px;font-weight:600}
    .s{font-size:14px;fill:#94a3b8}
    .xs{font-size:13px;fill:#94a3b8}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .z{font-size:15px;font-weight:700;letter-spacing:2px}
    .disk{fill:#2e2a0e;stroke:#facc15;stroke-width:2}
    .mem{fill:#1e1838;stroke:#a78bfa;stroke-width:2;stroke-dasharray:6 5}
    .eng{fill:#2a1a10;stroke:#f97316;stroke-width:2}
    .neu{fill:#1e293b;stroke:#334155;stroke-width:2}
    .ok{fill:#0f2a1c;stroke:#22c55e;stroke-width:2.5}
    .bad{fill:#3b1220;stroke:#f43f5e;stroke-width:2.5}
  </style>
  <rect width="1600" height="1210" fill="#0f172a"/>

  <text x="60" y="62" class="t">Bóveda de contraseñas y bloqueo</text>
  <text x="60" y="94" class="st">Opcional (Ajustes → Seguridad). Las contraseñas guardadas solo se abren con tu PIN y en este equipo.</text>

  <!-- ============ 1. CÓMO SE SACA LA LLAVE ============ -->
  <rect x="40" y="120" width="1520" height="362" rx="24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <use href="#i-pc" x="62" y="129" width="26" height="26" style="color:#94a3b8"/>
  <text x="98" y="149" class="z" style="fill:#94a3b8">TU PC · CÓMO SE SACA LA LLAVE</text>

  <!-- PIN -->
  <rect x="60" y="172" width="320" height="88" rx="12" class="mem"/>
  <use href="#i-user" x="74" y="186" width="34" height="34" style="color:#a78bfa"/>
  <text x="120" y="208" class="b">PIN de 6 dígitos</text>
  <text x="120" y="232" class="xs">solo números; marcado «pin6»</text>
  <text x="120" y="250" class="xs">nunca se guarda</text>

  <!-- Llave del equipo -->
  <rect x="60" y="274" width="320" height="88" rx="12" class="disk"/>
  <use href="#i-key" x="74" y="288" width="34" height="34" style="color:#facc15"/>
  <text x="120" y="310" class="b">Llave del equipo</text>
  <text x="120" y="334" class="xs">32 bytes al azar, en el llavero</text>
  <text x="120" y="352" class="xs mono" style="font-size:12px">usuario vault-device-key</text>

  <!-- Sal y parámetros -->
  <rect x="60" y="376" width="320" height="88" rx="12" class="disk"/>
  <use href="#i-file" x="74" y="390" width="34" height="34" style="color:#facc15"/>
  <text x="120" y="412" class="b">Sal y parámetros</text>
  <text x="120" y="436" class="xs">guardados en vault.json, a la vista</text>
  <text x="120" y="454" class="xs">(van autenticados)</text>

  <!-- flechas a Argon2 -->
  <line x1="382" y1="216" x2="456" y2="268" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#mp)"/>
  <line x1="382" y1="318" x2="456" y2="318" stroke="#facc15" stroke-width="2.5" marker-end="url(#my)"/>
  <line x1="382" y1="420" x2="456" y2="368" stroke="#facc15" stroke-width="2.5" marker-end="url(#my)"/>

  <!-- Argon2id -->
  <rect x="460" y="226" width="250" height="184" rx="14" class="eng"/>
  <use href="#i-gear" x="476" y="240" width="38" height="38" style="color:#f97316"/>
  <text x="526" y="267" class="h" style="fill:#f97316">Argon2id</text>
  <text x="476" y="302" class="s">PIN + llave del equipo</text>
  <text x="476" y="322" class="xs">(la llave entra como «secreto» K:</text>
  <text x="476" y="340" class="xs">sin ella no sale la misma llave)</text>
  <text x="476" y="370" class="s">~0,75 s en este equipo</text>
  <text x="476" y="392" class="xs">64 o 128 MiB · 3 a 20 pasadas</text>

  <!-- -> llave -->
  <line x1="712" y1="318" x2="768" y2="318" stroke="#f97316" stroke-width="3" marker-end="url(#mo)"/>

  <!-- Llave AES -->
  <rect x="772" y="262" width="230" height="112" rx="12" class="mem"/>
  <use href="#i-chip" x="786" y="276" width="34" height="34" style="color:#a78bfa"/>
  <text x="832" y="298" class="b">Llave AES-256</text>
  <text x="788" y="334" class="xs">solo en memoria</text>
  <text x="788" y="354" class="xs">se borra al bloquear</text>

  <!-- -> vault.json -->
  <line x1="1004" y1="318" x2="1066" y2="318" stroke="#a78bfa" stroke-width="3" marker-start="url(#mp)" marker-end="url(#mp)"/>
  <text x="1035" y="298" text-anchor="middle" class="xs" style="font-size:12px;fill:#c4b5fd">abre</text>
  <text x="1035" y="348" text-anchor="middle" class="xs" style="font-size:12px;fill:#c4b5fd">guarda</text>

  <!-- vault.json -->
  <rect x="1070" y="172" width="250" height="292" rx="14" class="disk"/>
  <use href="#i-db" x="1086" y="186" width="40" height="40" style="color:#facc15"/>
  <use href="#i-lock" x="1286" y="188" width="22" height="22" style="color:#facc15"/>
  <text x="1086" y="252" class="b mono" style="font-size:17px">vault.json</text>
  <text x="1086" y="276" class="s">AES-256-GCM</text>
  <text x="1086" y="296" class="xs">nonce nuevo en cada guardado</text>
  <text x="1086" y="314" class="xs">escritura atómica, 0600</text>
  <line x1="1086" y1="332" x2="1304" y2="332" stroke="#facc15" stroke-width="1" opacity=".5"/>
  <text x="1086" y="356" class="xs" style="fill:#facc15">Dentro, cifrado:</text>
  <text x="1086" y="380" class="s" style="fill:#e2e8f0">contraseñas y frases</text>
  <text x="1086" y="400" class="s" style="fill:#e2e8f0">de tus servidores</text>
  <text x="1086" y="422" class="s" style="fill:#e2e8f0">contraseñas de sudo</text>
  <text x="1086" y="444" class="s" style="fill:#e2e8f0">token de GitHub</text>

  <!-- vault-attempts.json -->
  <rect x="1340" y="172" width="200" height="292" rx="14" class="disk"/>
  <use href="#i-history" x="1354" y="186" width="38" height="38" style="color:#facc15"/>
  <text x="1354" y="252" class="mono" style="font-size:13px;font-weight:700">vault-attempts</text>
  <text x="1354" y="268" class="mono" style="font-size:13px;font-weight:700">.json</text>
  <text x="1354" y="296" class="s" style="fill:#e2e8f0">5 fallos libres</text>
  <text x="1354" y="320" class="xs">luego espera 30 s,</text>
  <text x="1354" y="338" class="xs">el doble cada vez,</text>
  <text x="1354" y="356" class="xs">hasta 15 min</text>
  <text x="1354" y="388" class="xs">sigue al reiniciar</text>
  <text x="1354" y="406" class="xs">la app</text>
  <text x="1354" y="436" class="xs" style="fill:#22c55e">nunca borra nada</text>

  <!-- ============ 2. ESTADOS ============ -->
  <rect x="40" y="504" width="870" height="400" rx="20" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="534" class="z" style="fill:#cbd5e1">ESTADOS</text>

  <!-- Sin bóveda -->
  <rect x="70" y="610" width="230" height="120" rx="14" class="neu"/>
  <use href="#i-key" x="86" y="624" width="34" height="34" style="color:#cbd5e1"/>
  <text x="132" y="648" class="b">Sin bóveda</text>
  <text x="86" y="684" class="xs">secretos en el llavero</text>
  <text x="86" y="704" class="xs">del sistema, como antes</text>

  <!-- Desbloqueado -->
  <rect x="600" y="550" width="280" height="110" rx="14" class="ok"/>
  <use href="#i-shield" x="616" y="564" width="34" height="34" style="color:#22c55e"/>
  <text x="662" y="588" class="b" style="fill:#22c55e">Desbloqueado</text>
  <text x="616" y="622" class="xs">llave y secretos en memoria</text>
  <text x="616" y="642" class="xs">guarda nuevos sin pedir el PIN</text>

  <!-- Bloqueado -->
  <rect x="600" y="772" width="280" height="110" rx="14" class="bad"/>
  <use href="#i-lock" x="616" y="786" width="34" height="34" style="color:#f43f5e"/>
  <text x="662" y="810" class="b" style="fill:#f43f5e">Bloqueado</text>
  <text x="616" y="844" class="xs">hay bóveda y falta el PIN</text>
  <text x="616" y="864" class="xs">el motor no da secretos</text>

  <!-- Proteger con PIN -->
  <path d="M185 610 V576 H596" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#mg)"/>
  <text x="400" y="566" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#22c55e">Proteger con PIN</text>
  <text x="400" y="594" text-anchor="middle" class="xs" style="font-size:12px">los secretos pasan del llavero a la bóveda</text>

  <!-- Quitar PIN -->
  <line x1="600" y1="636" x2="304" y2="636" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mw)" style="stroke:#cbd5e1"/>
  <text x="450" y="627" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#cbd5e1">Quitar PIN (con tu PIN)</text>
  <text x="450" y="656" text-anchor="middle" class="xs" style="font-size:12px">vuelven al llavero</text>

  <!-- bloquear / desbloquear -->
  <line x1="625" y1="662" x2="625" y2="768" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#mr)"/>
  <line x1="855" y1="770" x2="855" y2="664" stroke="#22c55e" stroke-width="2.5" marker-end="url(#mg)"/>
  <text x="640" y="690" style="font-size:14px;font-weight:700;fill:#f43f5e">bloquear</text>
  <text x="840" y="690" text-anchor="end" style="font-size:14px;font-weight:700;fill:#22c55e">con tu PIN</text>
  <text x="740" y="714" text-anchor="middle" class="xs" style="font-size:12px">al abrir la app</text>
  <text x="740" y="732" text-anchor="middle" class="xs" style="font-size:12px">5–60 min sin uso (15)</text>
  <text x="740" y="750" text-anchor="middle" class="xs" style="font-size:12px">Ctrl+Shift+L o el botón</text>

  <!-- Olvidé mi PIN -->
  <path d="M600 826 H185 V734" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#mr)"/>
  <text x="400" y="816" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#f43f5e">Olvidé mi PIN</text>
  <text x="400" y="846" text-anchor="middle" class="xs" style="font-size:12px">escribes BORRAR: se pierden las</text>
  <text x="400" y="862" text-anchor="middle" class="xs" style="font-size:12px">contraseñas guardadas y el token</text>
  <text x="205" y="762" class="xs" style="font-size:12px">se conservan servidores, llaves de</text>
  <text x="205" y="778" class="xs" style="font-size:12px">~/.ssh, comandos, túneles, ajustes y Gist</text>
  <text x="62" y="890" class="xs" style="font-size:12px">El tiempo con el equipo suspendido también cuenta como inactividad.</text>

  <!-- ============ 3. MIENTRAS ESTÁ BLOQUEADO ============ -->
  <rect x="930" y="504" width="630" height="400" rx="20" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="952" y="534" class="z" style="fill:#f43f5e">MIENTRAS ESTÁ BLOQUEADO</text>

  <use href="#i-gear" x="954" y="556" width="32" height="32" style="color:#f97316"/>
  <text x="1002" y="572" class="b">El estado vive en el motor (Rust)</text>
  <text x="1002" y="592" class="xs">las contraseñas guardadas responden «Locked», aunque una ventana siga a la vista</text>

  <use href="#i-window" x="954" y="624" width="32" height="32" style="color:#38bdf8"/>
  <text x="1002" y="640" class="b">Aviso <tspan class="mono" style="font-size:14px;font-weight:400">vault://state</tspan> a todas las ventanas</text>
  <text x="1002" y="660" class="xs">también los editores aparte: se tapan y no reciben teclas</text>

  <use href="#i-chip" x="954" y="692" width="32" height="32" style="color:#a78bfa"/>
  <text x="1002" y="708" class="b">Se borra de la memoria</text>
  <text x="1002" y="728" class="xs">llave y secretos (se pisan con ceros), token de GitHub en caché</text>
  <text x="1002" y="746" class="xs">y contraseñas de sudo de todas las conexiones</text>

  <use href="#i-server" x="954" y="776" width="32" height="32" style="color:#22c55e"/>
  <text x="1002" y="792" class="b">Las conexiones abiertas siguen vivas</text>
  <text x="1002" y="812" class="xs">terminales, transferencias y túneles no se cortan</text>

  <use href="#i-history" x="954" y="836" width="32" height="32" style="color:#facc15"/>
  <text x="1002" y="852" class="b">Una reconexión con contraseña espera</text>
  <text x="1002" y="872" class="xs">«esperando a que desbloquees SSHorus»; al desbloquear sigue sola</text>

  <!-- ============ 4. QUÉ PROTEGE ============ -->
  <text x="60" y="944" class="z" style="fill:#cbd5e1">QUÉ PROTEGE, SEGÚN QUIÉN ATAQUE</text>

  <rect x="40" y="960" width="493" height="196" rx="16" class="neu"/>
  <use href="#i-user" x="58" y="976" width="34" height="34" style="color:#cbd5e1"/>
  <text x="104" y="1000" class="b" style="font-size:17px">Alguien en tu PC</text>
  <rect x="405" y="980" width="110" height="26" rx="13" fill="#14532d" stroke="#22c55e"/>
  <text x="460" y="998" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#22c55e">Protegido</text>
  <text x="58" y="1040" class="s">pantalla de bloqueo en todas las ventanas</text>
  <text x="58" y="1064" class="s">sin el PIN no salen las contraseñas</text>
  <text x="58" y="1088" class="s">esperas crecientes tras 5 fallos</text>
  <text x="58" y="1128" class="s" style="fill:#facc15">ojo: las conexiones abiertas siguen vivas</text>

  <rect x="553" y="960" width="493" height="196" rx="16" class="neu"/>
  <use href="#i-file" x="571" y="976" width="34" height="34" style="color:#cbd5e1"/>
  <text x="617" y="1000" class="b" style="font-size:17px">Copia de vault.json a otro PC</text>
  <rect x="918" y="980" width="110" height="26" rx="13" fill="#14532d" stroke="#22c55e"/>
  <text x="973" y="998" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#22c55e">Protegido</text>
  <text x="571" y="1040" class="s">allí falta la llave del equipo (está en</text>
  <text x="571" y="1064" class="s">tu llavero): no se pueden probar PIN</text>
  <text x="571" y="1088" class="s">fuera de tu equipo</text>
  <text x="571" y="1128" class="s">tocar la cabecera rompe el descifrado</text>

  <rect x="1066" y="960" width="494" height="196" rx="16" class="neu"/>
  <use href="#i-eye" x="1084" y="976" width="34" height="34" style="color:#f43f5e"/>
  <text x="1130" y="1000" class="b" style="font-size:17px">Programa malicioso</text>
  <rect x="1432" y="980" width="110" height="26" rx="13" fill="#2e2a0e" stroke="#facc15"/>
  <text x="1487" y="998" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#facc15">Parcial</text>
  <text x="1084" y="1040" class="s">ya no lee las contraseñas del llavero,</text>
  <text x="1084" y="1064" class="s">pero podría ver el PIN al escribirlo</text>
  <text x="1084" y="1088" class="s">o la memoria mientras está abierta</text>
  <text x="1084" y="1128" class="s" style="fill:#e2e8f0">con el archivo y la llave del equipo</text>
  <text x="1084" y="1148" class="s" style="fill:#e2e8f0">podría probar PIN; Argon2id lo frena</text>

  <text x="60" y="1190" style="font-size:16px;fill:#94a3b8">No se cifra aquí: servidores, ajustes ni tus llaves de ~/.ssh (las llaves se protegen con su propia frase).</text>
</svg>
