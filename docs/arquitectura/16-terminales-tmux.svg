<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <!-- ICONOS (48x48, trazo; el color se da con style="color:#..." en <use>) -->
    <symbol id="i-pc" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="26" rx="3"/><path d="M18 41h12M24 33v8"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 48 48"><g fill="currentColor"><rect x="20" y="3" width="8" height="10" rx="2"/><rect x="20" y="35" width="8" height="10" rx="2"/><rect x="3" y="20" width="10" height="8" rx="2"/><rect x="35" y="20" width="10" height="8" rx="2"/><rect x="20" y="3" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="20" y="35" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="3" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/><rect x="35" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/></g><circle cx="24" cy="24" r="13" fill="currentColor"/><circle cx="24" cy="24" r="5.5" fill="#0f172a"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="6" y="5" width="36" height="11" rx="2.5"/><rect x="6" y="19" width="36" height="11" rx="2.5"/><rect x="6" y="33" width="36" height="11" rx="2.5"/></g><g fill="currentColor"><circle cx="35" cy="10.5" r="2"/><circle cx="35" cy="24.5" r="2"/><circle cx="35" cy="38.5" r="2"/><rect x="11" y="9" width="14" height="3" rx="1.5"/><rect x="11" y="23" width="14" height="3" rx="1.5"/><rect x="11" y="37" width="14" height="3" rx="1.5"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M14 38h22a9 9 0 0 0 1-17.9A12 12 0 0 0 14.3 17 10.5 10.5 0 0 0 14 38z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-term" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M12 18l7 6-7 6M23 31h12"/></g></symbol>
    <symbol id="i-stop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M5 6h18l20 20-17 17L5 23z"/></g><circle cx="14" cy="15" r="3" fill="currentColor"/></symbol>
    <symbol id="i-history" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 24a17 17 0 1 0 5-12"/><path d="M6 6v8h8M24 14v11l7 4"/></g></symbol>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .h{font-size:22px;font-weight:700}
    .b{font-size:17px;font-weight:600}
    .s{font-size:15px;fill:#94a3b8}
    .xs{font-size:14px;fill:#94a3b8}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .z{font-size:15px;font-weight:700;letter-spacing:2px}
    .lb{font-size:13px;font-weight:700;letter-spacing:1.5px}
  </style>
  <rect width="1600" height="1130" fill="#0f172a"/>
  <text x="60" y="62" class="t">Terminales persistentes (tmux)</text>
  <text x="60" y="94" class="st">Cada terminal vive en su propia sesión tmux en el servidor: sigue corriendo aunque se corte la red o cierres la app.</text>

  <!-- TU PC -->
  <rect x="40" y="120" width="660" height="480" rx="24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <use href="#i-pc" x="62" y="129" width="26" height="26" style="color:#94a3b8"/>
  <text x="98" y="149" class="z" style="fill:#94a3b8">TU PC</text>

  <rect x="70" y="165" width="600" height="160" rx="16" fill="#10243a" stroke="#38bdf8" stroke-width="2.5"/>
  <use href="#i-term" x="90" y="183" width="44" height="44" style="color:#38bdf8"/>
  <text x="150" y="208" class="h" style="fill:#38bdf8">Sub-pestaña de terminal</text>
  <text x="150" y="232" class="s">xterm.js · indicador ∞ si es persistente</text>
  <text x="90" y="272" class="xs">nombre estable:</text>
  <text x="200" y="272" class="mono" style="font-size:14px;fill:#7dd3fc">sshorus-1a2b3c4d</text>
  <text x="352" y="272" class="xs">(4 bytes al azar)</text>
  <text x="90" y="300" class="xs">el modo decide si se pide tmux: Automático, Siempre o Nunca</text>

  <line x1="300" y1="328" x2="300" y2="380" stroke="#a78bfa" stroke-width="3" marker-end="url(#mp)"/>
  <text x="316" y="360" class="mono" style="font-size:14px;fill:#c4b5fd">term_open { name, replay }</text>

  <rect x="70" y="385" width="600" height="190" rx="16" fill="#2a1a10" stroke="#f97316" stroke-width="2.5"/>
  <use href="#i-gear" x="90" y="403" width="44" height="44" style="color:#f97316"/>
  <text x="150" y="428" class="h" style="fill:#f97316">Motor</text>
  <text x="232" y="428" class="mono" style="font-size:15px;fill:#94a3b8">terminal/tmux.rs</text>
  <text x="150" y="452" class="s">decide cómo abrir la shell</text>
  <text x="90" y="488" class="xs">1. Busca tmux por exec (PATH y rutas típicas), versión ≥ 1.8</text>
  <text x="90" y="512" class="xs">2. Lo recuerda por conexión (si falta, solo 20 s)</text>
  <text x="90" y="536" class="xs">3. Abre un canal con PTY: sh -c '… new-session -A -s sshorus-…'</text>
  <text x="90" y="560" class="xs" style="fill:#fdba74">Sin tmux: shell normal y la respuesta (TermOpened) lo avisa</text>

  <!-- SSH -->
  <line x1="676" y1="470" x2="904" y2="470" stroke="#22c55e" stroke-width="3.5" marker-start="url(#mg)" marker-end="url(#mg)"/>
  <rect x="752" y="440" width="76" height="20" fill="#0f172a"/>
  <text x="790" y="456" text-anchor="middle" style="fill:#22c55e;font-weight:700;font-size:16px">SSH</text>
  <rect x="736" y="480" width="108" height="20" fill="#0f172a"/>
  <text x="790" y="495" text-anchor="middle" class="xs" style="font-size:13px">canal con PTY</text>

  <!-- SERVIDOR -->
  <rect x="880" y="120" width="680" height="480" rx="24" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="10 8"/>
  <use href="#i-server" x="902" y="129" width="26" height="26" style="color:#22c55e"/>
  <text x="938" y="149" class="z" style="fill:#22c55e">TU SERVIDOR</text>

  <rect x="910" y="165" width="620" height="410" rx="16" fill="#0f2a1c" stroke="#22c55e" stroke-width="2.5"/>
  <use href="#i-server" x="930" y="183" width="44" height="44" style="color:#22c55e"/>
  <text x="990" y="208" class="h" style="fill:#22c55e">Servidor tmux de SSHorus</text>
  <text x="990" y="234" class="mono" style="font-size:15px">tmux -L sshorus -f /dev/null</text>
  <text x="935" y="276" class="lb" style="fill:#86efac">UNA SESIÓN POR TERMINAL</text>

  <rect x="935" y="288" width="180" height="76" rx="10" fill="#14301f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="949" y="318" class="mono" style="font-size:14px">sshorus-1a2b3c4d</text>
  <text x="949" y="344" class="xs" style="font-size:13px">bash</text>
  <rect x="1127" y="288" width="180" height="76" rx="10" fill="#14301f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1141" y="318" class="mono" style="font-size:14px">sshorus-9f0e7d6c</text>
  <text x="1141" y="344" class="xs" style="font-size:13px">npm run build</text>
  <rect x="1319" y="288" width="180" height="76" rx="10" fill="#14301f" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1333" y="318" class="mono" style="font-size:14px">sshorus-55aa01ff</text>
  <text x="1333" y="344" class="xs" style="font-size:13px">suelta: nadie la mira</text>
  <text x="935" y="396" class="lb" style="fill:#86efac">SUS AJUSTES (al arrancarlo, solo una vez)</text>
  <rect x="935" y="408" width="276" height="34" rx="8" fill="#14301f" stroke="#2f6b45" stroke-width="1.2"/>
  <text x="949" y="430" class="xs" style="fill:#e2e8f0">sin barra de estado</text>
  <rect x="1223" y="408" width="276" height="34" rx="8" fill="#14301f" stroke="#2f6b45" stroke-width="1.2"/>
  <text x="1237" y="430" class="xs" style="fill:#e2e8f0">sin tecla prefijo: Ctrl+B pasa</text>
  <rect x="935" y="450" width="276" height="34" rx="8" fill="#14301f" stroke="#2f6b45" stroke-width="1.2"/>
  <text x="949" y="472" class="xs" style="fill:#e2e8f0">sin pantalla alternativa</text>
  <rect x="1223" y="450" width="276" height="34" rx="8" fill="#14301f" stroke="#2f6b45" stroke-width="1.2"/>
  <text x="1237" y="472" class="xs" style="fill:#e2e8f0">historial de 50.000 líneas</text>
  <rect x="935" y="512" width="564" height="44" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1217" y="539" text-anchor="middle" class="xs">Tu tmux y tu ~/.tmux.conf: no se tocan (otro servidor tmux)</text>
  <rect x="45" y="640" width="490" height="200" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <use href="#i-cloud" x="65" y="658" width="30" height="30" style="color:#22c55e"/>
  <text x="107" y="681" class="b" style="font-size:18px;fill:#22c55e">Se corta la red</text>
  <text x="65" y="720" class="xs">La sesión sigue viva en el servidor:</text>
  <text x="65" y="744" class="xs">lo que corría no se detiene.</text>
  <text x="65" y="768" class="xs">La reconexión automática (mismo sessionId)</text>
  <text x="65" y="792" class="xs">se engancha a la misma sesión:</text>
  <text x="65" y="820" class="mono" style="font-size:13px;fill:#22c55e">— reconectado: volviendo a la sesión tmux —</text>
  <rect x="555" y="640" width="490" height="200" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <use href="#i-history" x="575" y="658" width="30" height="30" style="color:#38bdf8"/>
  <text x="617" y="681" class="b" style="font-size:18px;fill:#38bdf8">Reabrir en una terminal nueva</text>
  <text x="575" y="720" class="xs">Con «Reconectar» o desde la lista.</text>
  <text x="575" y="744" class="xs">Antes de engancharse se vuelcan hasta</text>
  <text x="575" y="768" class="xs">10.000 líneas (capture-pane) al historial</text>
  <text x="575" y="792" class="xs">de xterm.js; luego tmux redibuja la pantalla.</text>
  <rect x="1065" y="640" width="490" height="200" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
  <use href="#i-stop" x="1085" y="658" width="30" height="30" style="color:#f43f5e"/>
  <text x="1127" y="681" class="b" style="font-size:18px;fill:#f43f5e">Cerrar o desacoplar</text>
  <text x="1085" y="720" class="xs">✕ cierra la terminal y su sesión (kill-session).</text>
  <text x="1085" y="744" class="xs">«Desacoplar»: la sesión sigue corriendo.</text>
  <text x="1085" y="768" class="xs">Cerrar la pestaña de conexión termina sus sesiones.</text>
  <text x="1085" y="792" class="xs">Si se perdió la conexión o cerraste la app, quedan.</text>
  <rect x="45" y="860" width="490" height="200" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <use href="#i-server" x="65" y="878" width="30" height="30" style="color:#22c55e"/>
  <text x="107" y="901" class="b" style="font-size:18px;fill:#22c55e">Sesiones en el servidor</text>
  <text x="65" y="940" class="xs">Lista las sueltas por exec (term_tmux_list);</text>
  <text x="65" y="964" class="xs">un contador en la barra avisa si hay alguna.</text>
  <text x="65" y="988" class="xs">Reabrir, cerrar o copiar el comando para</text>
  <text x="65" y="1012" class="xs">engancharte desde una shell normal:</text>
  <text x="65" y="1040" class="mono" style="font-size:13px;fill:#22c55e">tmux -L sshorus attach -t sshorus-…</text>
  <rect x="555" y="860" width="490" height="200" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <use href="#i-tag" x="575" y="878" width="30" height="30" style="color:#a78bfa"/>
  <text x="617" y="901" class="b" style="font-size:18px;fill:#a78bfa">Modos</text>
  <text x="575" y="940" class="xs">Automático: tmux si el servidor lo tiene.</text>
  <text x="575" y="964" class="xs">Siempre: si falta, terminal normal y un aviso</text>
  <text x="575" y="988" class="xs">con el comando para instalarlo en tu distro.</text>
  <text x="575" y="1012" class="xs">Nunca: terminales normales.</text>
  <text x="575" y="1036" class="xs">General y por servidor (manda el del servidor).</text>
  <rect x="1065" y="860" width="490" height="200" rx="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <use href="#i-term" x="1085" y="878" width="30" height="30" style="color:#cbd5e1"/>
  <text x="1127" y="901" class="b" style="font-size:18px;fill:#cbd5e1">Como una terminal normal</text>
  <text x="1085" y="940" class="xs">Sin barra ni tecla prefijo: Ctrl+B llega</text>
  <text x="1085" y="964" class="xs">a los programas.</text>
  <text x="1085" y="988" class="xs">Sin pantalla alternativa: la rueda, la búsqueda</text>
  <text x="1085" y="1012" class="xs">(Ctrl+Mayús+F), la selección y los enlaces</text>
  <text x="1085" y="1036" class="xs">son los de xterm.js.</text>
  <text x="60" y="1102" style="font-size:17px;fill:#94a3b8">El nombre de la sesión es estable: la misma terminal siempre vuelve a su sesión, aunque cambie la conexión.</text>
</svg>