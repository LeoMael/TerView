<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070">
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <!-- ICONOS (48x48, trazo; el color se da con style="color:#..." en <use>) -->
    <symbol id="i-pc" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="26" rx="3"/><path d="M18 41h12M24 33v8"/></g></symbol>
    <symbol id="i-window" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M4 16h40"/></g><g fill="currentColor"><circle cx="10" cy="11.5" r="1.8"/><circle cx="16" cy="11.5" r="1.8"/><circle cx="22" cy="11.5" r="1.8"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 48 48"><g fill="currentColor"><rect x="20" y="3" width="8" height="10" rx="2"/><rect x="20" y="35" width="8" height="10" rx="2"/><rect x="3" y="20" width="10" height="8" rx="2"/><rect x="35" y="20" width="10" height="8" rx="2"/><rect x="20" y="3" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="20" y="35" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="3" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/><rect x="35" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/></g><circle cx="24" cy="24" r="13" fill="currentColor"/><circle cx="24" cy="24" r="5.5" fill="#0f172a"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="6" y="5" width="36" height="11" rx="2.5"/><rect x="6" y="19" width="36" height="11" rx="2.5"/><rect x="6" y="33" width="36" height="11" rx="2.5"/></g><g fill="currentColor"><circle cx="35" cy="10.5" r="2"/><circle cx="35" cy="24.5" r="2"/><circle cx="35" cy="38.5" r="2"/><rect x="11" y="9" width="14" height="3" rx="1.5"/><rect x="11" y="23" width="14" height="3" rx="1.5"/><rect x="11" y="37" width="14" height="3" rx="1.5"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M14 38h22a9 9 0 0 0 1-17.9A12 12 0 0 0 14.3 17 10.5 10.5 0 0 0 14 38z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-git" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="14" cy="10" r="5"/><circle cx="14" cy="38" r="5"/><circle cx="34" cy="16" r="5"/><path d="M14 15v18M34 21c0 9-20 6-20 12"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v28c0 3.3 7.2 6 16 6s16-2.7 16-6V10"/><path d="M8 19c0 3.3 7.2 6 16 6s16-2.7 16-6M8 28.5c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="30" r="9"/><path d="M21.5 23.5 40 5M33 12l5 5M28 17l4 4"/></g></symbol>
    <symbol id="i-folder" viewBox="0 0 48 48"><path d="M5 13a3 3 0 0 1 3-3h10l4 5h18a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M12 4h17l9 9v31H12z"/><path d="M29 4v9h9M18 24h14M18 31h14"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="9" y="21" width="30" height="22" rx="3"/><path d="M15 21v-6a9 9 0 0 1 18 0v6"/></g><circle cx="24" cy="32" r="3" fill="currentColor"/></symbol>
    <symbol id="i-chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="12" y="12" width="24" height="24" rx="3"/><path d="M18 5v6M24 5v6M30 5v6M18 37v6M24 37v6M30 37v6M5 18h6M5 24h6M5 30h6M37 18h6M37 24h6M37 30h6"/></g><rect x="19" y="19" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-box" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M24 4 42 13v22L24 44 6 35V13z"/><path d="M6 13l18 9 18-9M24 22v22"/></g></symbol>
    <symbol id="i-term" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M12 18l7 6-7 6M23 31h12"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4 40 10v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v36h36"/><path d="M12 32l9-10 7 6 12-15"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="15" r="8"/><path d="M8 43c0-9 7-15 16-15s16 6 16 15"/></g></symbol>
    <symbol id="i-tunnel" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 40V24a20 20 0 0 1 40 0v16"/><path d="M14 40V25a10 10 0 0 1 20 0v15"/><path d="M4 40h10M34 40h10"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="19"/><ellipse cx="24" cy="24" rx="8" ry="19"/><path d="M5 24h38M8 14h32M8 34h32"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 48 48"><path d="M14 8l26 16-26 16z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M5 6h18l20 20-17 17L5 23z"/></g><circle cx="14" cy="15" r="3" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v24M14 21l10 10 10-10M6 36v6h36v-6"/></g></symbol>
    <symbol id="i-hand" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26V9a3 3 0 0 1 6 0v14M22 21V6a3 3 0 0 1 6 0v15M28 21V9a3 3 0 0 1 6 0v14M34 23v-7a3 3 0 0 1 6 0v12c0 9-6 16-15 16-6 0-9-3-12-7l-6-9a3 3 0 0 1 5-3l3 3"/></g></symbol>
    <symbol id="i-history" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 24a17 17 0 1 0 5-12"/><path d="M6 6v8h8M24 14v11l7 4"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M3 24s8-14 21-14 21 14 21 14-8 14-21 14S3 24 3 24z"/><circle cx="24" cy="24" r="6"/></g></symbol>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .h{font-size:24px;font-weight:700}
    .b{font-size:17px;font-weight:600}
    .s{font-size:14px;fill:#94a3b8}
    .xs{font-size:13px;fill:#94a3b8}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .z{font-size:15px;font-weight:700;letter-spacing:2px}
    .pc{fill:#1e293b;stroke:#2c4a66;stroke-width:1.5}
    .mo{fill:#2a1a10;stroke:#f97316;stroke-width:2}
    .sv{fill:#14301f;stroke:#22c55e;stroke-width:1.5}
    .pipe{fill:#1e293b;stroke:#475569;stroke-width:2}
  </style>
  <rect width="1600" height="1070" fill="#0f172a"/>

  <text x="60" y="62" class="t">Túneles: local, remoto y SOCKS</text>
  <text x="60" y="94" class="st">Viajan dentro de la misma conexión SSH de la pestaña. Cada túnel se guarda por servidor.</text>

  <!-- Zonas -->
  <rect x="40" y="120" width="580" height="600" rx="24" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="64" y="152" class="z" style="fill:#94a3b8">TU PC</text>
  <rect x="980" y="120" width="580" height="600" rx="24" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1004" y="152" class="z" style="fill:#22c55e">TUS SERVIDORES</text>
  <text x="800" y="152" text-anchor="middle" class="z" style="fill:#64748b">CONEXIÓN SSH</text>

  <!-- ============ Fila 1: LOCAL ============ -->
  <text x="70" y="192"><tspan style="font-size:18px;font-weight:700;fill:#38bdf8">Local (-L)</tspan><tspan class="s" style="font-size:15px" dx="10">un puerto de tu PC lleva a un destino visto desde el servidor</tspan></text>
  <rect x="70" y="207" width="220" height="110" rx="14" class="pc"/>
  <use href="#i-globe" x="86" y="221" width="34" height="34" style="color:#38bdf8"/>
  <text x="132" y="245" class="b">Tu programa</text>
  <text x="86" y="283" class="s">navegador, cliente de BD…</text>

  <rect x="360" y="207" width="240" height="110" rx="14" class="mo"/>
  <use href="#i-gear" x="376" y="221" width="34" height="34" style="color:#f97316"/>
  <text x="422" y="245" class="b">Motor escucha</text>
  <text x="376" y="281" class="mono" style="font-size:15px;fill:#fdba74">127.0.0.1:8080</text>
  <text x="376" y="303" class="xs">en tu PC</text>

  <line x1="290" y1="262" x2="356" y2="262" stroke="#38bdf8" stroke-width="3" marker-end="url(#mb)"/>

  <rect x="612" y="242" width="376" height="40" rx="20" class="pipe"/>
  <line x1="600" y1="262" x2="996" y2="262" stroke="#38bdf8" stroke-width="3" marker-end="url(#mb)"/>
  <text x="800" y="232" text-anchor="middle" class="mono" style="font-size:15px;font-weight:700;fill:#38bdf8">canal direct-tcpip</text>
  <text x="800" y="304" text-anchor="middle" class="xs">uno por cada conexión</text>

  <rect x="1000" y="207" width="230" height="110" rx="14" class="sv"/>
  <use href="#i-server" x="1016" y="221" width="34" height="34" style="color:#22c55e"/>
  <text x="1062" y="245" class="b">sshd</text>
  <text x="1016" y="283" class="s">abre la conexión</text>
  <text x="1016" y="303" class="s">hacia el destino</text>

  <line x1="1230" y1="262" x2="1306" y2="262" stroke="#38bdf8" stroke-width="3" marker-end="url(#mb)"/>

  <rect x="1310" y="207" width="225" height="110" rx="14" class="sv"/>
  <use href="#i-db" x="1326" y="221" width="34" height="34" style="color:#22c55e"/>
  <text x="1372" y="245" class="b">Destino</text>
  <text x="1326" y="281" class="mono" style="font-size:15px;fill:#86efac">127.0.0.1:5432</text>
  <text x="1326" y="303" class="xs">visto desde el servidor</text>

  <!-- ============ Fila 2: REMOTO ============ -->
  <text x="70" y="382"><tspan style="font-size:18px;font-weight:700;fill:#2dd4bf">Remoto (-R)</tspan><tspan class="s" style="font-size:15px" dx="10">un puerto del servidor lleva a un destino de tu PC</tspan></text>
  <rect x="70" y="397" width="220" height="110" rx="14" class="pc"/>
  <use href="#i-window" x="86" y="411" width="34" height="34" style="color:#38bdf8"/>
  <text x="132" y="435" class="b">Destino</text>
  <text x="86" y="471" class="mono" style="font-size:15px;fill:#7dd3fc">localhost:3000</text>
  <text x="86" y="493" class="xs">tu PC o tu red</text>

  <line x1="356" y1="452" x2="294" y2="452" stroke="#2dd4bf" stroke-width="3" marker-end="url(#mt)"/>

  <rect x="360" y="397" width="240" height="110" rx="14" class="mo"/>
  <use href="#i-gear" x="376" y="411" width="34" height="34" style="color:#f97316"/>
  <text x="422" y="435" class="b">Motor recibe</text>
  <text x="376" y="471" class="s">y conecta con el destino</text>
  <text x="376" y="493" class="xs mono">ssh::handler → remote</text>

  <rect x="612" y="432" width="376" height="40" rx="20" class="pipe"/>
  <line x1="996" y1="452" x2="604" y2="452" stroke="#2dd4bf" stroke-width="3" marker-end="url(#mt)"/>
  <text x="800" y="422" text-anchor="middle" class="mono" style="font-size:15px;font-weight:700;fill:#2dd4bf">canal forwarded-tcpip</text>
  <text x="800" y="494" text-anchor="middle" class="xs">lo abre el servidor</text>

  <rect x="1000" y="397" width="230" height="110" rx="14" class="sv"/>
  <use href="#i-server" x="1016" y="411" width="34" height="34" style="color:#22c55e"/>
  <text x="1062" y="435" class="b">sshd escucha</text>
  <text x="1016" y="471" class="mono" style="font-size:15px;fill:#86efac">puerto 9000</text>
  <text x="1016" y="493" class="xs">pedido con tcpip-forward</text>

  <line x1="1306" y1="452" x2="1234" y2="452" stroke="#2dd4bf" stroke-width="3" marker-end="url(#mt)"/>

  <rect x="1310" y="397" width="225" height="110" rx="14" class="sv"/>
  <use href="#i-user" x="1326" y="411" width="34" height="34" style="color:#22c55e"/>
  <text x="1372" y="435" class="b">Quien entra</text>
  <text x="1326" y="471" class="s">al puerto 9000</text>
  <text x="1326" y="493" class="xs">del servidor</text>

  <!-- ============ Fila 3: SOCKS ============ -->
  <text x="70" y="572"><tspan style="font-size:18px;font-weight:700;fill:#a78bfa">SOCKS5 (-D)</tspan><tspan class="s" style="font-size:15px" dx="10">tu navegador sale a la red como si estuviera en el servidor</tspan></text>
  <rect x="70" y="587" width="220" height="110" rx="14" class="pc"/>
  <use href="#i-globe" x="86" y="601" width="34" height="34" style="color:#38bdf8"/>
  <text x="132" y="625" class="b">Navegador</text>
  <text x="86" y="663" class="s">con proxy SOCKS5</text>

  <line x1="290" y1="642" x2="356" y2="642" stroke="#a78bfa" stroke-width="3" marker-end="url(#mp)"/>

  <rect x="360" y="587" width="240" height="110" rx="14" class="mo"/>
  <use href="#i-gear" x="376" y="601" width="34" height="34" style="color:#f97316"/>
  <text x="422" y="625" class="b">Proxy SOCKS5</text>
  <text x="376" y="661" class="mono" style="font-size:15px;fill:#fdba74">127.0.0.1:1080</text>
  <text x="376" y="683" class="xs">solo CONNECT, sin usuario</text>

  <rect x="612" y="622" width="376" height="40" rx="20" class="pipe"/>
  <line x1="600" y1="642" x2="996" y2="642" stroke="#a78bfa" stroke-width="3" marker-end="url(#mp)"/>
  <text x="800" y="612" text-anchor="middle" class="mono" style="font-size:15px;font-weight:700;fill:#a78bfa">canal direct-tcpip</text>
  <text x="800" y="684" text-anchor="middle" class="xs">hacia el host:puerto que se pida</text>

  <rect x="1000" y="587" width="230" height="110" rx="14" class="sv"/>
  <use href="#i-server" x="1016" y="601" width="34" height="34" style="color:#22c55e"/>
  <text x="1062" y="625" class="b">sshd</text>
  <text x="1016" y="663" class="s">sale a la red</text>
  <text x="1016" y="683" class="s">desde el servidor</text>

  <line x1="1230" y1="642" x2="1306" y2="642" stroke="#a78bfa" stroke-width="3" marker-end="url(#mp)"/>

  <rect x="1310" y="587" width="225" height="110" rx="14" class="sv"/>
  <use href="#i-cloud" x="1326" y="601" width="34" height="34" style="color:#22c55e"/>
  <text x="1372" y="625" class="b">Cualquier sitio</text>
  <text x="1326" y="661" class="mono" style="font-size:15px;fill:#86efac">host:puerto</text>
  <text x="1326" y="683" class="xs">el que pida el navegador</text>

  <!-- ============ Abajo: guardar, vigilar, ver ============ -->
  <text x="60" y="768" class="z" style="fill:#94a3b8">CÓMO SE GUARDAN, SE VIGILAN Y SE ABREN</text>

  <rect x="40" y="788" width="330" height="200" rx="16" fill="#2e2a0e" stroke="#facc15" stroke-width="2"/>
  <use href="#i-db" x="58" y="806" width="40" height="40" style="color:#facc15"/>
  <text x="112" y="834" class="b">tunnels.json</text>
  <text x="58" y="874" class="s">Definiciones guardadas por servidor:</text>
  <text x="58" y="896" class="s">tipo, puertos, destino, autoStart</text>
  <text x="58" y="932" class="xs mono">Linux: ~/.config/terview/</text>
  <text x="58" y="954" class="xs mono">Windows: %APPDATA%\terview\</text>

  <rect x="390" y="788" width="440" height="200" rx="16" fill="#2a1a10" stroke="#f97316" stroke-width="2"/>
  <use href="#i-history" x="408" y="806" width="40" height="40" style="color:#f97316"/>
  <text x="462" y="834" class="b">Vigilante del motor · cada 1 s</text>
  <text x="408" y="874" class="s">• Se cae la conexión → estado «Esperando»</text>
  <text x="408" y="900" class="s">• Vuelve → reabre los remotos (hasta 30 intentos)</text>
  <text x="408" y="926" class="s">• Sesión nueva → arranca los de autoStart</text>
  <text x="408" y="952" class="s">• Pestaña cerrada → para sus túneles</text>

  <rect x="850" y="788" width="300" height="200" rx="16" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
  <use href="#i-window" x="868" y="806" width="40" height="40" style="color:#38bdf8"/>
  <text x="922" y="834" class="b">Pestaña Túneles</text>
  <text x="868" y="874" class="s">Estado, conexiones y bytes</text>
  <text x="868" y="900" class="s">en vivo, por el evento</text>
  <text x="868" y="926" class="mono" style="font-size:14px;fill:#7dd3fc">tunnel://status</text>
  <text x="868" y="952" class="xs">como mucho 1 vez por segundo</text>

  <rect x="1170" y="788" width="390" height="200" rx="16" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
  <use href="#i-tunnel" x="1188" y="806" width="40" height="40" style="color:#38bdf8"/>
  <text x="1242" y="834" class="b">«Abrir túnel a mi PC»</text>
  <text x="1188" y="874" class="s">Desde Administración → Puertos y desde</text>
  <text x="1188" y="896" class="s">Contenedores (puertos publicados).</text>
  <text x="1188" y="926" class="s">Reutiliza o crea un túnel local, lo arranca</text>
  <text x="1188" y="948" class="s">y copia <tspan class="mono" style="fill:#7dd3fc">localhost:PUERTO</tspan>.</text>
  <text x="1188" y="972" class="xs">Puerto menor de 1024 → uno libre en tu PC.</text>

  <text x="60" y="1040" style="font-size:17px;fill:#94a3b8">Local y SOCKS piden la sesión actual en cada conexión nueva: tras una reconexión siguen funcionando sin reabrir el puerto.</text>
</svg>
