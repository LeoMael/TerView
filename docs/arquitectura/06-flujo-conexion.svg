<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .hd{font-size:18px;font-weight:700}
    .l{font-size:15px;paint-order:stroke;stroke:#0f172a;stroke-width:8px;stroke-linejoin:round}
    .ld{font-size:15px;fill:#94a3b8;paint-order:stroke;stroke:#0f172a;stroke-width:8px;stroke-linejoin:round}
    .n{font-size:13px;font-weight:700;fill:#0f172a}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .ll{stroke:#334155;stroke-width:2;stroke-dasharray:6 6}
    .a{stroke:#e2e8f0;stroke-width:2}
    .r{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}
  </style>
  <rect width="1600" height="1080" fill="#0f172a"/>

  <text x="60" y="62" class="t">Qué pasa al conectarte</text>
  <text x="60" y="94" class="st">De arriba hacia abajo, en orden. Todo ocurre en 1 o 2 segundos.</text>

  <!-- cabeceras -->
  <rect x="70" y="130" width="160" height="50" rx="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/><text x="150" y="162" text-anchor="middle" class="hd">Tú</text>
  <rect x="350" y="130" width="160" height="50" rx="12" fill="#10243a" stroke="#38bdf8" stroke-width="2"/><text x="430" y="162" text-anchor="middle" class="hd" style="fill:#38bdf8">Interfaz</text>
  <rect x="630" y="130" width="160" height="50" rx="12" fill="#2a1a10" stroke="#f97316" stroke-width="2"/><text x="710" y="162" text-anchor="middle" class="hd" style="fill:#f97316">Motor</text>
  <rect x="890" y="130" width="200" height="50" rx="12" fill="#2e2550" stroke="#a78bfa" stroke-width="2"/><text x="990" y="162" text-anchor="middle" class="hd" style="fill:#a78bfa">Llavero</text>
  <rect x="1220" y="130" width="160" height="50" rx="12" fill="#0f2a1c" stroke="#22c55e" stroke-width="2"/><text x="1300" y="162" text-anchor="middle" class="hd" style="fill:#22c55e">Servidor</text>

  <line x1="150" y1="184" x2="150" y2="1040" class="ll"/>
  <line x1="430" y1="184" x2="430" y2="1040" class="ll"/>
  <line x1="710" y1="184" x2="710" y2="1040" class="ll"/>
  <line x1="990" y1="184" x2="990" y2="1040" class="ll"/>
  <line x1="1300" y1="184" x2="1300" y2="1040" class="ll"/>

  <!-- 1 -->
  <circle cx="40" cy="225" r="13" fill="#e2e8f0"/><text x="40" y="230" text-anchor="middle" class="n">1</text>
  <line x1="150" y1="230" x2="426" y2="230" class="a" marker-end="url(#m)"/>
  <text x="290" y="220" text-anchor="middle" class="l">doble clic en «web-prod»</text>
  <!-- 2 -->
  <circle cx="40" cy="285" r="13" fill="#e2e8f0"/><text x="40" y="290" text-anchor="middle" class="n">2</text>
  <line x1="430" y1="290" x2="706" y2="290" class="a" marker-end="url(#m)"/>
  <text x="570" y="280" text-anchor="middle" class="l mono" style="font-size:14px">ssh_connect(perfil)</text>
  <!-- 3 -->
  <circle cx="40" cy="345" r="13" fill="#e2e8f0"/><text x="40" y="350" text-anchor="middle" class="n">3</text>
  <line x1="710" y1="350" x2="986" y2="350" class="a" marker-end="url(#m)"/>
  <text x="850" y="340" text-anchor="middle" class="l">¿contraseña de web-prod?</text>
  <!-- 4 -->
  <circle cx="40" cy="405" r="13" fill="#e2e8f0"/><text x="40" y="410" text-anchor="middle" class="n">4</text>
  <line x1="990" y1="410" x2="714" y2="410" class="r" marker-end="url(#md)"/>
  <text x="850" y="400" text-anchor="middle" class="ld">contraseña (solo en memoria)</text>
  <!-- 5 -->
  <circle cx="40" cy="465" r="13" fill="#e2e8f0"/><text x="40" y="470" text-anchor="middle" class="n">5</text>
  <line x1="710" y1="470" x2="1296" y2="470" class="a" marker-end="url(#m)"/>
  <text x="1005" y="460" text-anchor="middle" class="l">abrir conexión al puerto 22 y negociar cifrado</text>
  <!-- 6 -->
  <circle cx="40" cy="525" r="13" fill="#e2e8f0"/><text x="40" y="530" text-anchor="middle" class="n">6</text>
  <line x1="1300" y1="530" x2="714" y2="530" class="r" marker-end="url(#md)"/>
  <text x="1005" y="520" text-anchor="middle" class="ld">huella digital del servidor</text>
  <!-- 7 -->
  <circle cx="40" cy="590" r="13" fill="#e2e8f0"/><text x="40" y="595" text-anchor="middle" class="n">7</text>
  <rect x="560" y="565" width="300" height="56" rx="10" fill="#2a1a10" stroke="#f97316"/>
  <text x="710" y="590" text-anchor="middle" style="font-size:15px">comparar con</text>
  <text x="710" y="611" text-anchor="middle" class="mono" style="font-size:13px;fill:#fdba74">~/.ssh/known_hosts</text>

  <!-- alternativas -->
  <rect x="300" y="640" width="1180" height="120" rx="12" fill="#0f172a" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="320" y="666" style="font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#facc15">SEGÚN LA HUELLA</text>
  <circle cx="335" cy="696" r="6" fill="#22c55e"/><text x="350" y="701" class="l"><tspan font-weight="700">Coincide:</tspan> sigue sin preguntar.</text>
  <circle cx="770" cy="696" r="6" fill="#facc15"/><text x="785" y="701" class="l"><tspan font-weight="700">Es nueva:</tspan> la interfaz te pregunta «¿confías?».</text>
  <circle cx="335" cy="736" r="6" fill="#f43f5e"/><text x="350" y="741" class="l"><tspan font-weight="700">Cambió:</tspan> se BLOQUEA y avisa. Puede ser un ataque (alguien suplantando el servidor).</text>

  <!-- 8 -->
  <circle cx="40" cy="805" r="13" fill="#e2e8f0"/><text x="40" y="810" text-anchor="middle" class="n">8</text>
  <line x1="710" y1="810" x2="1296" y2="810" class="a" marker-end="url(#m)"/>
  <text x="1005" y="800" text-anchor="middle" class="l">autenticar (llave SSH o contraseña)</text>
  <!-- 9 -->
  <circle cx="40" cy="865" r="13" fill="#e2e8f0"/><text x="40" y="870" text-anchor="middle" class="n">9</text>
  <line x1="1300" y1="870" x2="714" y2="870" class="r" marker-end="url(#md)"/>
  <text x="1005" y="860" text-anchor="middle" class="ld">acceso concedido</text>
  <!-- 10 -->
  <circle cx="40" cy="925" r="13" fill="#e2e8f0"/><text x="40" y="930" text-anchor="middle" class="n">10</text>
  <line x1="710" y1="930" x2="1296" y2="930" class="a" marker-end="url(#m)"/>
  <text x="1005" y="920" text-anchor="middle" class="l">abrir canal de terminal + canal SFTP</text>
  <!-- 11 -->
  <circle cx="40" cy="985" r="13" fill="#e2e8f0"/><text x="40" y="990" text-anchor="middle" class="n">11</text>
  <line x1="710" y1="990" x2="434" y2="990" class="r" marker-end="url(#md)"/>
  <text x="570" y="980" text-anchor="middle" class="ld mono" style="font-size:14px">sessionId</text>
  <line x1="430" y1="1025" x2="154" y2="1025" class="r" marker-end="url(#md)"/>
  <text x="290" y="1015" text-anchor="middle" class="ld">pestaña nueva lista</text>
</svg>
