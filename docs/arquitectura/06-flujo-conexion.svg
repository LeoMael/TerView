<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>
    <!-- ICONOS (48x48, trazo; el color se da con style="color:#..." en <use>) -->
    <symbol id="i-pc" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="26" rx="3"/><path d="M18 41h12M24 33v8"/></g></symbol>
    <symbol id="i-window" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M4 16h40"/></g><g fill="currentColor"><circle cx="10" cy="11.5" r="1.8"/><circle cx="16" cy="11.5" r="1.8"/><circle cx="22" cy="11.5" r="1.8"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 48 48"><g fill="currentColor"><rect x="20" y="3" width="8" height="10" rx="2"/><rect x="20" y="35" width="8" height="10" rx="2"/><rect x="3" y="20" width="10" height="8" rx="2"/><rect x="35" y="20" width="10" height="8" rx="2"/><rect x="20" y="3" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="20" y="35" width="8" height="10" rx="2" transform="rotate(45 24 24)"/><rect x="3" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/><rect x="35" y="20" width="10" height="8" rx="2" transform="rotate(45 24 24)"/></g><circle cx="24" cy="24" r="13" fill="currentColor"/><circle cx="24" cy="24" r="5.5" fill="#0f172a"/></symbol>
    <symbol id="i-server" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="6" y="5" width="36" height="11" rx="2.5"/><rect x="6" y="19" width="36" height="11" rx="2.5"/><rect x="6" y="33" width="36" height="11" rx="2.5"/></g><g fill="currentColor"><circle cx="35" cy="10.5" r="2"/><circle cx="35" cy="24.5" r="2"/><circle cx="35" cy="38.5" r="2"/><rect x="11" y="9" width="14" height="3" rx="1.5"/><rect x="11" y="23" width="14" height="3" rx="1.5"/><rect x="11" y="37" width="14" height="3" rx="1.5"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M14 38h22a9 9 0 0 0 1-17.9A12 12 0 0 0 14.3 17 10.5 10.5 0 0 0 14 38z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-git" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="14" cy="10" r="5"/><circle cx="14" cy="38" r="5"/><circle cx="34" cy="16" r="5"/><path d="M14 15v18M34 21c0 9-20 6-20 12"/></g></symbol>
    <symbol id="i-db" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><ellipse cx="24" cy="10" rx="16" ry="6"/><path d="M8 10v28c0 3.3 7.2 6 16 6s16-2.7 16-6V10"/><path d="M8 19c0 3.3 7.2 6 16 6s16-2.7 16-6M8 28.5c0 3.3 7.2 6 16 6s16-2.7 16-6"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="30" r="9"/><path d="M21.5 23.5 40 5M33 12l5 5M28 17l4 4"/></g></symbol>
    <symbol id="i-folder" viewBox="0 0 48 48"><path d="M5 13a3 3 0 0 1 3-3h10l4 5h18a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M12 4h17l9 9v31H12z"/><path d="M29 4v9h9M18 24h14M18 31h14"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="9" y="21" width="30" height="22" rx="3"/><path d="M15 21v-6a9 9 0 0 1 18 0v6"/></g><circle cx="24" cy="32" r="3" fill="currentColor"/></symbol>
    <symbol id="i-chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="12" y="12" width="24" height="24" rx="3"/><path d="M18 5v6M24 5v6M30 5v6M18 37v6M24 37v6M30 37v6M5 18h6M5 24h6M5 30h6M37 18h6M37 24h6M37 30h6"/></g><rect x="19" y="19" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-box" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M24 4 42 13v22L24 44 6 35V13z"/><path d="M6 13l18 9 18-9M24 22v22"/></g></symbol>
    <symbol id="i-term" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="4"/><path d="M12 18l7 6-7 6M23 31h12"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4 40 10v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v36h36"/><path d="M12 32l9-10 7 6 12-15"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="15" r="8"/><path d="M8 43c0-9 7-15 16-15s16 6 16 15"/></g></symbol>
    <symbol id="i-tunnel" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 40V24a20 20 0 0 1 40 0v16"/><path d="M14 40V25a10 10 0 0 1 20 0v15"/><path d="M4 40h10M34 40h10"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="19"/><ellipse cx="24" cy="24" rx="8" ry="19"/><path d="M5 24h38M8 14h32M8 34h32"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 48 48"><path d="M14 8l26 16-26 16z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M5 6h18l20 20-17 17L5 23z"/></g><circle cx="14" cy="15" r="3" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v24M14 21l10 10 10-10M6 36v6h36v-6"/></g></symbol>
    <symbol id="i-hand" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26V9a3 3 0 0 1 6 0v14M22 21V6a3 3 0 0 1 6 0v15M28 21V9a3 3 0 0 1 6 0v14M34 23v-7a3 3 0 0 1 6 0v12c0 9-6 16-15 16-6 0-9-3-12-7l-6-9a3 3 0 0 1 5-3l3 3"/></g></symbol>
    <symbol id="i-history" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 24a17 17 0 1 0 5-12"/><path d="M6 6v8h8M24 14v11l7 4"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M3 24s8-14 21-14 21 14 21 14-8 14-21 14S3 24 3 24z"/><circle cx="24" cy="24" r="6"/></g></symbol>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .hd{font-size:18px;font-weight:700}
    .l{font-size:15px;paint-order:stroke;stroke:#0f172a;stroke-width:8px;stroke-linejoin:round}
    .ld{font-size:15px;fill:#94a3b8;paint-order:stroke;stroke:#0f172a;stroke-width:8px;stroke-linejoin:round}
    .n{font-size:13px;font-weight:700;fill:#0f172a}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .ll{stroke:#334155;stroke-width:2;stroke-dasharray:6 6}
    .a{stroke:#e2e8f0;stroke-width:2}
    .r{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}
    .z{font-size:13px;font-weight:700;letter-spacing:1.5px}
  </style>
  <rect width="1600" height="1400" fill="#0f172a"/>

  <text x="60" y="62" class="t">Qué pasa al conectarte</text>
  <text x="60" y="94" class="st">De arriba hacia abajo, en orden. Todo ocurre en 1 o 2 segundos.</text>

  <!-- cabeceras -->
  <rect x="60" y="130" width="180" height="50" rx="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
  <use href="#i-user" x="84" y="140" width="30" height="30" style="color:#cbd5e1"/><text x="160" y="162" text-anchor="middle" class="hd">Tú</text>
  <rect x="340" y="130" width="180" height="50" rx="12" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
  <use href="#i-window" x="356" y="140" width="30" height="30" style="color:#38bdf8"/><text x="448" y="162" text-anchor="middle" class="hd" style="fill:#38bdf8">Interfaz</text>
  <rect x="620" y="130" width="180" height="50" rx="12" fill="#2a1a10" stroke="#f97316" stroke-width="2"/>
  <use href="#i-gear" x="636" y="140" width="30" height="30" style="color:#f97316"/><text x="728" y="162" text-anchor="middle" class="hd" style="fill:#f97316">Motor</text>
  <rect x="890" y="130" width="200" height="50" rx="12" fill="#2e2a0e" stroke="#facc15" stroke-width="2"/>
  <use href="#i-key" x="906" y="140" width="30" height="30" style="color:#facc15"/><text x="1013" y="161" text-anchor="middle" class="hd" style="fill:#facc15;font-size:16px">Llavero o bóveda</text>
  <rect x="1200" y="130" width="200" height="50" rx="12" fill="#0f2a1c" stroke="#22c55e" stroke-width="2"/>
  <use href="#i-server" x="1216" y="140" width="30" height="30" style="color:#22c55e"/><text x="1312" y="162" text-anchor="middle" class="hd" style="fill:#22c55e">Servidor</text>

  <line x1="150" y1="184" x2="150" y2="1185" class="ll"/>
  <line x1="430" y1="184" x2="430" y2="1185" class="ll"/>
  <line x1="710" y1="184" x2="710" y2="1185" class="ll"/>
  <line x1="990" y1="184" x2="990" y2="1185" class="ll"/>
  <line x1="1300" y1="184" x2="1300" y2="1185" class="ll"/>

  <!-- 1 -->
  <circle cx="40" cy="225" r="13" fill="#e2e8f0"/><text x="40" y="230" text-anchor="middle" class="n">1</text>
  <line x1="150" y1="230" x2="426" y2="230" class="a" marker-end="url(#m)"/>
  <text x="290" y="220" text-anchor="middle" class="l">doble clic en «web-prod»</text>
  <!-- 2 -->
  <circle cx="40" cy="285" r="13" fill="#e2e8f0"/><text x="40" y="290" text-anchor="middle" class="n">2</text>
  <line x1="430" y1="290" x2="706" y2="290" class="a" marker-end="url(#m)"/>
  <text x="570" y="280" text-anchor="middle" class="l mono" style="font-size:14px">ssh_connect(perfil)</text>
  <!-- 3 -->
  <circle cx="40" cy="345" r="13" fill="#e2e8f0"/><text x="40" y="350" text-anchor="middle" class="n">3</text>
  <line x1="710" y1="350" x2="986" y2="350" class="a" marker-end="url(#m)"/>
  <text x="850" y="340" text-anchor="middle" class="l">¿secreto guardado de web-prod?</text>
  <!-- 4 -->
  <circle cx="40" cy="405" r="13" fill="#e2e8f0"/><text x="40" y="410" text-anchor="middle" class="n">4</text>
  <line x1="990" y1="410" x2="714" y2="410" class="r" marker-end="url(#md)"/>
  <text x="850" y="400" text-anchor="middle" class="ld">contraseña o frase (solo en memoria)</text>
  <!-- 5 -->
  <circle cx="40" cy="465" r="13" fill="#e2e8f0"/><text x="40" y="470" text-anchor="middle" class="n">5</text>
  <line x1="710" y1="470" x2="1296" y2="470" class="a" marker-end="url(#m)"/>
  <text x="1005" y="460" text-anchor="middle" class="l">abrir conexión al puerto 22 y negociar cifrado</text>
  <!-- 6 -->
  <circle cx="40" cy="525" r="13" fill="#e2e8f0"/><text x="40" y="530" text-anchor="middle" class="n">6</text>
  <line x1="1300" y1="530" x2="714" y2="530" class="r" marker-end="url(#md)"/>
  <text x="1005" y="520" text-anchor="middle" class="ld">huella digital del servidor</text>
  <!-- 7 -->
  <circle cx="40" cy="590" r="13" fill="#e2e8f0"/><text x="40" y="595" text-anchor="middle" class="n">7</text>
  <rect x="560" y="565" width="300" height="56" rx="10" fill="#2a1a10" stroke="#f97316"/>
  <text x="710" y="590" text-anchor="middle" style="font-size:15px">comparar con</text>
  <text x="710" y="611" text-anchor="middle" class="mono" style="font-size:13px;fill:#fdba74">~/.ssh/known_hosts</text>

  <!-- según la huella -->
  <rect x="300" y="640" width="1180" height="150" rx="12" fill="#0f172a" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="320" y="666" class="z" style="fill:#facc15">SEGÚN LA HUELLA</text>
  <circle cx="335" cy="696" r="6" fill="#22c55e"/><text x="350" y="701" class="l"><tspan font-weight="700">Coincide:</tspan> sigue sin preguntar.</text>
  <circle cx="770" cy="696" r="6" fill="#facc15"/><text x="785" y="701" class="l"><tspan font-weight="700">Es nueva:</tspan> la interfaz te muestra la huella y pregunta «¿confías?».</text>
  <circle cx="335" cy="731" r="6" fill="#f43f5e"/><text x="350" y="736" class="l"><tspan font-weight="700">Cambió:</tspan> aviso rojo de posible ataque (alguien suplantando el servidor). Solo sigue si tú lo confirmas.</text>
  <text x="350" y="771" class="l" style="fill:#94a3b8">Si confías: <tspan class="mono" style="font-size:14px;fill:#e2e8f0">ssh_trust_host</tspan> guarda la huella en known_hosts (reemplaza la anterior) y se repite el paso 2.</text>

  <!-- 8 -->
  <circle cx="40" cy="835" r="13" fill="#e2e8f0"/><text x="40" y="840" text-anchor="middle" class="n">8</text>
  <line x1="710" y1="840" x2="1296" y2="840" class="a" marker-end="url(#m)"/>
  <text x="1005" y="830" text-anchor="middle" class="l">autenticar (llave, contraseña o agente; código 2FA si lo pide)</text>

  <!-- si falta algo -->
  <rect x="300" y="865" width="1180" height="100" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="320" y="891" class="z" style="fill:#38bdf8">SI FALTA ALGO</text>
  <text x="320" y="923" class="l">Contraseña, frase de la llave o código 2FA: el motor lo dice, la interfaz te lo pide y se repite el paso 2.</text>
  <text x="320" y="950" class="l" style="fill:#94a3b8">Si el secreto del llavero ya no sirve, también te lo pide de nuevo. El código 2FA nunca se guarda.</text>

  <!-- 9 -->
  <circle cx="40" cy="1005" r="13" fill="#e2e8f0"/><text x="40" y="1010" text-anchor="middle" class="n">9</text>
  <line x1="1300" y1="1010" x2="714" y2="1010" class="r" marker-end="url(#md)"/>
  <text x="1005" y="1000" text-anchor="middle" class="ld">acceso concedido</text>
  <!-- 10 -->
  <circle cx="40" cy="1060" r="13" fill="#e2e8f0"/><text x="40" y="1065" text-anchor="middle" class="n">10</text>
  <line x1="710" y1="1065" x2="986" y2="1065" stroke="#facc15" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#my)"/>
  <text x="850" y="1055" text-anchor="middle" class="l" style="fill:#facc15">guardar si marcaste «Recordar»</text>
  <!-- 11 -->
  <circle cx="40" cy="1115" r="13" fill="#e2e8f0"/><text x="40" y="1120" text-anchor="middle" class="n">11</text>
  <line x1="710" y1="1120" x2="434" y2="1120" class="r" marker-end="url(#md)"/>
  <text x="570" y="1110" text-anchor="middle" class="ld mono" style="font-size:14px">sessionId</text>
  <!-- 12 -->
  <circle cx="40" cy="1165" r="13" fill="#e2e8f0"/><text x="40" y="1170" text-anchor="middle" class="n">12</text>
  <line x1="430" y1="1170" x2="154" y2="1170" class="r" marker-end="url(#md)"/>
  <text x="290" y="1160" text-anchor="middle" class="ld">pestaña nueva lista</text>

  <!-- después -->
  <rect x="60" y="1205" width="1420" height="160" rx="12" fill="#131c2e" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="80" y="1232" class="z" style="fill:#cbd5e1">DESPUÉS, EN SEGUNDO PLANO</text>
  <use href="#i-term" x="80" y="1248" width="22" height="22" style="color:#38bdf8"/>
  <text x="114" y="1265" class="l"><tspan font-weight="700">Terminal y explorador:</tspan> la terminal abre su canal con PTY (dentro de tmux si se puede); el explorador abre su canal SFTP al primer uso.</text>
  <use href="#i-shield" x="80" y="1276" width="22" height="22" style="color:#a78bfa"/>
  <text x="114" y="1293" class="l"><tspan font-weight="700">Privilegios:</tspan> un comando aparte (exec) mira si eres root, tienes sudo o eres usuario normal, sin pedir contraseña.</text>
  <use href="#i-tunnel" x="80" y="1304" width="22" height="22" style="color:#2dd4bf"/>
  <text x="114" y="1321" class="l"><tspan font-weight="700">Túneles con «arranque automático»:</tspan> el vigilante de túneles (revisa cada segundo) los activa solo.</text>
  <use href="#i-eye" x="80" y="1332" width="22" height="22" style="color:#f97316"/>
  <text x="114" y="1349" class="l"><tspan font-weight="700">Vigilante de la conexión:</tspan> señal de vida cada 10 s; si se cae, reconecta en la misma pestaña (5 intentos por defecto).</text>
</svg>
