    <symbol id="i-play" viewBox="0 0 48 48"><path d="M14 8l26 16-26 16z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
    <symbol id="i-tag" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M5 6h18l20 20-17 17L5 23z"/></g><circle cx="14" cy="15" r="3" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v24M14 21l10 10 10-10M6 36v6h36v-6"/></g></symbol>
    <symbol id="i-hand" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 26V9a3 3 0 0 1 6 0v14M22 21V6a3 3 0 0 1 6 0v15M28 21V9a3 3 0 0 1 6 0v14M34 23v-7a3 3 0 0 1 6 0v12c0 9-6 16-15 16-6 0-9-3-12-7l-6-9a3 3 0 0 1 5-3l3 3"/></g></symbol>
    <symbol id="i-history" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 24a17 17 0 1 0 5-12"/><path d="M6 6v8h8M24 14v11l7 4"/></g></symbol>
    <symbol id="i-eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M3 24s8-14 21-14 21 14 21 14-8 14-21 14S3 24 3 24z"/><circle cx="24" cy="24" r="6"/></g></symbol>
  </defs>
  <style>
    text{font-family:'Noto Sans','DejaVu Sans',sans-serif;fill:#e2e8f0}
    .t{font-size:34px;font-weight:700}
    .st{font-size:18px;fill:#94a3b8}
    .h{font-size:20px;font-weight:700}
    .b{font-size:18px;font-weight:600}
    .s{font-size:15px;fill:#94a3b8}
    .xs{font-size:13px;fill:#94a3b8}
    .n{font-size:18px;font-weight:700;fill:#0f172a}
    .mono{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace}
    .z{font-size:14px;font-weight:700;letter-spacing:2px}
    .step{fill:#1e293b;stroke:#334155;stroke-width:1.5}
    .card{fill:#1e293b;stroke:#334155}
  </style>
  <rect width="1600" height="1000" fill="#0f172a"/>

  <text x="60" y="62" class="t">Subir una carpeta completa</text>
  <text x="60" y="94" class="st">Ejemplo: arrastras la carpeta fotos/ (2.000 archivos) al explorador. Bajar funciona igual, al revés.</text>

  <!-- Pasos -->
  <rect x="60" y="130" width="260" height="140" rx="14" class="step"/>
  <circle cx="94" cy="166" r="18" fill="#38bdf8"/><text x="94" y="172" text-anchor="middle" class="n">1</text>
  <text x="124" y="173" class="b">Arrastras</text>
  <use href="#i-hand" x="270" y="146" width="34" height="34" style="color:#38bdf8"/>
  <text x="80" y="215" class="s">la carpeta fotos/</text><text x="80" y="238" class="s">desde tu PC al explorador</text>

  <line x1="322" y1="200" x2="361" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#mm)"/>

  <rect x="365" y="130" width="260" height="140" rx="14" class="step"/>
  <circle cx="399" cy="166" r="18" fill="#a78bfa"/><text x="399" y="172" text-anchor="middle" class="n">2</text>
  <text x="429" y="173" class="b">Se recorre</text>
  <use href="#i-folder" x="575" y="146" width="34" height="34" style="color:#a78bfa"/>
  <text x="385" y="215" class="s">2.000 archivos y 12 carpetas;</text><text x="385" y="238" class="s">los enlaces se recrean</text>

  <line x1="627" y1="200" x2="666" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#mm)"/>

  <rect x="670" y="130" width="260" height="140" rx="14" class="step"/>
  <circle cx="704" cy="166" r="18" fill="#facc15"/><text x="704" y="172" text-anchor="middle" class="n">3</text>
  <text x="734" y="173" class="b">Crea carpetas</text>
  <use href="#i-server" x="880" y="146" width="34" height="34" style="color:#facc15"/>
  <text x="690" y="215" class="s">la misma estructura en el</text><text x="690" y="238" class="s">servidor, varias a la vez</text>

  <line x1="932" y1="200" x2="971" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#mm)"/>

  <rect x="975" y="130" width="260" height="140" rx="14" fill="#2e1a0e" stroke="#f97316" stroke-width="2"/>
  <circle cx="1009" cy="166" r="18" fill="#f97316"/><text x="1009" y="172" text-anchor="middle" class="n">4</text>
  <text x="1039" y="173" class="b">Transfiere</text>
  <use href="#i-gear" x="1185" y="146" width="34" height="34" style="color:#f97316"/>
  <text x="995" y="215" class="s">4 trabajadores a la vez</text><text x="995" y="238" class="s">(ajustable de 1 a 8)</text>

  <line x1="1237" y1="200" x2="1276" y2="200" stroke="#64748b" stroke-width="3" marker-end="url(#mm)"/>

  <rect x="1280" y="130" width="260" height="140" rx="14" class="step"/>
  <circle cx="1314" cy="166" r="18" fill="#22c55e"/><text x="1314" y="172" text-anchor="middle" class="n">5</text>
  <text x="1344" y="173" class="b">Listo</text>
  <use href="#i-window" x="1490" y="146" width="34" height="34" style="color:#22c55e"/>
  <text x="1300" y="215" class="s">el explorador se refresca</text><text x="1300" y="238" class="s">y avisa si algo falló</text>

  <!-- Detalle paso 4 -->
  <path d="M1105,272 L1105,300 L60,300 L60,320" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="80" y="345" class="z" style="fill:#f97316">DETALLE DEL PASO 4</text>

  <text x="80" y="395" class="h">COLA</text>
  <text x="140" y="395" class="xs">una por servidor, en orden</text>
  <rect x="80" y="410" width="270" height="36" rx="8" class="card"/><text x="96" y="434" class="mono" style="font-size:14px">fotos/img_0645.jpg</text>
  <rect x="80" y="452" width="270" height="36" rx="8" class="card"/><text x="96" y="476" class="mono" style="font-size:14px">fotos/img_0646.jpg</text>
  <rect x="80" y="494" width="270" height="36" rx="8" class="card"/><text x="96" y="518" class="mono" style="font-size:14px">fotos/img_0647.jpg</text>
  <rect x="80" y="536" width="270" height="36" rx="8" class="card"/><text x="96" y="560" class="mono" style="font-size:14px">fotos/viaje/mar_01.png</text>
  <rect x="80" y="578" width="270" height="36" rx="8" class="card"/><text x="96" y="602" class="mono" style="font-size:14px">fotos/viaje/mar_02.png</text>
  <rect x="80" y="620" width="270" height="36" rx="8" class="card"/><text x="96" y="644" class="mono" style="font-size:14px">fotos/viaje/mar_03.png</text>
  <text x="96" y="690" class="s">… y 1.350 más</text>

  <line x1="352" y1="530" x2="452" y2="442" stroke="#f97316" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="352" y1="530" x2="452" y2="542" stroke="#f97316" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="352" y1="530" x2="452" y2="642" stroke="#f97316" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="352" y1="530" x2="452" y2="742" stroke="#f97316" stroke-width="2" marker-end="url(#mo)"/>

  <rect x="460" y="400" width="300" height="84" rx="12" fill="#2e1a0e" stroke="#f97316"/>
  <text x="480" y="428" class="b">Trabajador 1</text><text x="620" y="428" class="mono" style="font-size:13px;fill:#94a3b8">img_0641.jpg</text>
  <rect x="480" y="452" width="260" height="10" rx="5" fill="#334155"/><rect x="480" y="452" width="203" height="10" rx="5" fill="#f97316"/>
  <text x="740" y="477" text-anchor="end" class="xs" style="font-size:12px">78%</text>

  <rect x="460" y="500" width="300" height="84" rx="12" fill="#2e1a0e" stroke="#f97316"/>
  <text x="480" y="528" class="b">Trabajador 2</text><text x="620" y="528" class="mono" style="font-size:13px;fill:#94a3b8">img_0642.jpg</text>
  <rect x="480" y="552" width="260" height="10" rx="5" fill="#334155"/><rect x="480" y="552" width="117" height="10" rx="5" fill="#f97316"/>
  <text x="740" y="577" text-anchor="end" class="xs" style="font-size:12px">45%</text>

  <rect x="460" y="600" width="300" height="84" rx="12" fill="#2e1a0e" stroke="#f97316"/>
  <text x="480" y="628" class="b">Trabajador 3</text><text x="620" y="628" class="mono" style="font-size:13px;fill:#94a3b8">img_0643.jpg</text>
  <rect x="480" y="652" width="260" height="10" rx="5" fill="#334155"/><rect x="480" y="652" width="239" height="10" rx="5" fill="#f97316"/>
  <text x="740" y="677" text-anchor="end" class="xs" style="font-size:12px">92%</text>

  <rect x="460" y="700" width="300" height="84" rx="12" fill="#2e1a0e" stroke="#f97316"/>
  <text x="480" y="728" class="b">Trabajador 4</text><text x="620" y="728" class="mono" style="font-size:13px;fill:#94a3b8">img_0644.jpg</text>
  <rect x="480" y="752" width="260" height="10" rx="5" fill="#334155"/><rect x="480" y="752" width="31" height="10" rx="5" fill="#f97316"/>
  <text x="740" y="777" text-anchor="end" class="xs" style="font-size:12px">12%</text>

  <!-- Reserva de canales -->
  <rect x="460" y="806" width="300" height="58" rx="12" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="6 5"/>
  <use href="#i-lock" x="474" y="818" width="32" height="32" style="color:#facc15"/>
  <text x="518" y="830" style="font-size:15px;font-weight:700;fill:#facc15">Reserva de canales SFTP</text>
  <text x="518" y="851" class="xs">hasta 10 por servidor, se reutilizan</text>

  <!-- Flechas a servidor -->
  <line x1="762" y1="442" x2="1002" y2="442" stroke="#f97316" stroke-width="2.5" marker-end="url(#mo)"/>
  <line x1="762" y1="542" x2="1002" y2="542" stroke="#f97316" stroke-width="2.5" marker-end="url(#mo)"/>
  <line x1="762" y1="642" x2="1002" y2="642" stroke="#f97316" stroke-width="2.5" marker-end="url(#mo)"/>
  <line x1="762" y1="742" x2="1002" y2="742" stroke="#f97316" stroke-width="2.5" marker-end="url(#mo)"/>
  <text x="882" y="428" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#f97316">SFTP</text>
  <text x="882" y="500" text-anchor="middle" class="xs">bloques de 255 KB</text>
  <text x="882" y="518" text-anchor="middle" class="xs">sin esperar respuesta</text>
  <text x="882" y="600" text-anchor="middle" class="xs">~4 MB en vuelo</text>
  <text x="882" y="618" text-anchor="middle" class="xs">por archivo</text>

  <rect x="1010" y="380" width="250" height="420" rx="16" fill="#0f2a1c" stroke="#22c55e" stroke-width="2"/>
  <use href="#i-server" x="1030" y="396" width="30" height="30" style="color:#22c55e"/>
  <text x="1070" y="418" class="h" style="fill:#22c55e">SERVIDOR</text>
  <text x="1030" y="452" class="mono" style="font-size:14px;fill:#94a3b8">/var/www/fotos/</text>
  <circle cx="1038" cy="486" r="5" fill="#22c55e"/><text x="1052" y="491" class="mono" style="font-size:14px">img_0001.jpg</text>
  <circle cx="1038" cy="516" r="5" fill="#22c55e"/><text x="1052" y="521" class="mono" style="font-size:14px">img_0002.jpg</text>
  <circle cx="1038" cy="546" r="5" fill="#22c55e"/><text x="1052" y="551" class="mono" style="font-size:14px">img_0003.jpg</text>
  <text x="1052" y="581" class="s">…</text>
  <circle cx="1038" cy="606" r="5" fill="#22c55e"/><text x="1052" y="611" class="mono" style="font-size:14px">img_0640.jpg</text>
  <text x="1030" y="660" class="b">640 de 2.000</text>
  <rect x="1030" y="676" width="210" height="12" rx="6" fill="#14532d"/><rect x="1030" y="676" width="67" height="12" rx="6" fill="#22c55e"/>
  <text x="1030" y="720" class="s">12 MB/s · faltan ~3 min</text>
  <text x="1030" y="762" class="xs">fecha y permisos</text>
  <text x="1030" y="780" class="xs">se copian al terminar</text>

  <!-- Si ya existe -->
  <rect x="1290" y="380" width="270" height="420" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="1310" y="418" class="z" style="fill:#38bdf8">SI YA EXISTE</text>
  <text x="1310" y="440" class="xs">Ajustes → Transferencias</text>
  <text x="1310" y="482" class="b" style="font-size:16px">Sobrescribir</text>
  <text x="1310" y="504" class="s">opción por defecto</text>
  <text x="1310" y="548" class="b" style="font-size:16px">Omitir</text>
  <text x="1310" y="570" class="s">no toca el que ya está</text>
  <text x="1310" y="614" class="b" style="font-size:16px">Solo si es más nuevo</text>
  <text x="1310" y="636" class="s">compara la fecha</text>
  <text x="1310" y="680" class="b" style="font-size:16px">Preguntar</text>
  <text x="1310" y="702" class="s">archivo por archivo:</text>
  <text x="1310" y="724" class="s">sobrescribir, omitir o</text>
  <text x="1310" y="746" class="s">mantener ambos, con</text>
  <text x="1310" y="768" class="s">«aplicar a todos»</text>

  <!-- Si algo falla -->
  <rect x="800" y="830" width="760" height="132" rx="16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="820" y="862" class="z" style="fill:#cbd5e1">SI ALGO FALLA</text>
  <text x="820" y="898" class="b" style="font-size:16px">Error en un archivo</text>
  <text x="820" y="922" class="s">se reintenta hasta 3 veces</text>
  <text x="1060" y="898" class="b" style="font-size:16px">Se corta la conexión</text>
  <text x="1060" y="922" class="s">espera la reconexión (hasta 5 min)</text>
  <text x="1060" y="942" class="s">y sigue desde lo ya confirmado</text>
  <text x="1376" y="898" class="b" style="font-size:16px">Pausar / cancelar</text>
  <text x="1376" y="922" class="s">en cualquier momento</text>

