  <!-- código -->
  <text x="860" y="270" class="ln">1</text><text x="888" y="270" class="code" xml:space="preserve"><tspan fill="#f472b6">server</tspan> {</text>
  <text x="860" y="294" class="ln">2</text><text x="888" y="294" class="code" xml:space="preserve">  <tspan fill="#38bdf8">listen</tspan> 443 ssl;</text>
  <text x="860" y="318" class="ln">3</text><text x="888" y="318" class="code" xml:space="preserve">  <tspan fill="#38bdf8">server_name</tspan> app.ejemplo.com;</text>
  <text x="860" y="342" class="ln">4</text><text x="888" y="342" class="code" xml:space="preserve">  <tspan fill="#38bdf8">root</tspan> /var/www/app/public;</text>
  <text x="860" y="366" class="ln">5</text><text x="888" y="366" class="code" xml:space="preserve">  <tspan fill="#f472b6">location</tspan> /api/ {</text>
  <text x="860" y="390" class="ln">6</text><text x="888" y="390" class="code" xml:space="preserve">    <tspan fill="#38bdf8">proxy_pass</tspan> <tspan fill="#22c55e">http://127.0.0.1:3000</tspan>;</text>
  <text x="860" y="414" class="ln">7</text><text x="888" y="414" class="code" xml:space="preserve">  }</text>
  <text x="860" y="438" class="ln">8</text><text x="888" y="438" class="code" xml:space="preserve">}</text>

